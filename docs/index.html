<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="A draft observatory that maps what is measured about gradual disempowerment, link by link, and where the human side goes unmeasured.">
<title>Gradual Disempowerment Observatory</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=IBM+Plex+Mono:wght@400;500&family=Source+Serif+4:ital,opsz,wght@0,8..60,400..700;1,8..60,400..700&display=swap">
<style>
:root{color-scheme:light}body{margin:0}img{max-width:100%}[hidden]{display:none!important}
/* Layout: a survey chart. Sticky top bar; one view at a time; the chain map is the home page's main object;
   evidence pages run claim → indicator tabs joined to a figure → three short lists. Rules over boxes.
   Colour grammar: blue, navy and grey are observed; orange is forecast; hatching is unmeasured. */
:root{
  --paper:#f1f4f6; --surface:#fbfcfd; --surface-2:#e7ecf0; --rule:#cfd8df; --grid:#e2e8ed;
  --ink:#0e1a26; --ink-2:#435363; --ink-3:#6b7986;
  --accent:#1c5cab; --accent-soft:#dbe7f5; --on-accent:#ffffff;
  /* evidence ramp for the map: 4 heavy line, 3 light line, 2 hollow line, 1 dots, 0 faint dots */
  --ev4:#0d366b; --ev3:#1c5cab; --ev2:#1c5cab; --ev1:#2a78d6; --ev0:#8f9ca8;
  /* observed series, fixed order: blue, navy, slate; context grey */
  --s1:#1c5cab; --s2:#5b9bea; --s3:#7b8996; --ctx:#a7b2bc; --map-bg:var(--surface);
  /* projection ramp: slow, central, rapid */
  --p1:#ee9670; --p2:#e0602c; --p3:#9c3d16; --on-p1:#16222e; --on-p2:#16222e; --on-p3:#ffffff;
  --f-display:"Archivo","Arial Narrow",Arial,sans-serif;
  --f-text:"Source Serif 4",Georgia,"Times New Roman",serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --maxw:1180px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --paper:#0e151d; --surface:#141d27; --surface-2:#1c2733; --rule:#2e3c4b; --grid:#212d39;
  --ink:#e8eef4; --ink-2:#aebac6; --ink-3:#8795a3;
  --accent:#7db2ee; --accent-soft:#172a40; --on-accent:#0b1420;
  --ev4:#9cc6f5; --ev3:#5b9bea; --ev2:#5b9bea; --ev1:#4a8be0; --ev0:#66747f;
  --s1:#8fbdf3; --s2:#3f76c0; --s3:#8795a3; --ctx:#5d6b79;
  --p1:#f2a685; --p2:#e2703f; --p3:#b84d1f; --on-p1:#0b1420; --on-p2:#0b1420; --on-p3:#ffffff;
  color-scheme:dark } }
:root[data-theme="dark"]{
  --paper:#0e151d; --surface:#141d27; --surface-2:#1c2733; --rule:#2e3c4b; --grid:#212d39;
  --ink:#e8eef4; --ink-2:#aebac6; --ink-3:#8795a3;
  --accent:#7db2ee; --accent-soft:#172a40; --on-accent:#0b1420;
  --ev4:#9cc6f5; --ev3:#5b9bea; --ev2:#5b9bea; --ev1:#4a8be0; --ev0:#66747f;
  --s1:#8fbdf3; --s2:#3f76c0; --s3:#8795a3; --ctx:#5d6b79;
  --p1:#f2a685; --p2:#e2703f; --p3:#b84d1f; --on-p1:#0b1420; --on-p2:#0b1420; --on-p3:#ffffff;
  color-scheme:dark }

*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{background:var(--paper);color:var(--ink);font-family:var(--f-display);font-size:15px;line-height:1.5;margin:0;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
.wrap{max-width:var(--maxw);margin:0 auto;padding-inline:20px}
h1,h2,h3,h4{font-family:var(--f-display);margin:0;text-wrap:balance;font-weight:700;letter-spacing:-.01em}
p{margin:0}
a{color:var(--accent);text-underline-offset:2px}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:2px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums;letter-spacing:0}
.lab{font-family:var(--f-mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)}
.prose{font-family:var(--f-text);font-size:17px;line-height:1.55;color:var(--ink)}
.prose p+p{margin-top:.8em}

/* ---------- top bar ---------- */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--paper) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--rule)}
.bar .wrap{display:flex;align-items:center;gap:8px 24px;min-height:52px;flex-wrap:wrap;padding-block:6px}
.mark{display:flex;align-items:center;gap:10px;font-weight:700;font-size:14px;letter-spacing:.01em;color:var(--ink);text-decoration:none;margin-right:auto;font-stretch:108%}
.mark svg{flex:0 0 auto}
.nav{display:flex;gap:2px;flex-wrap:wrap}
.nav a{font-size:13.5px;font-weight:500;color:var(--ink-2);text-decoration:none;padding:6px 10px;border-radius:4px;position:relative}
.nav a:hover{color:var(--ink);background:var(--surface-2)}
.nav a[aria-current="page"]{color:var(--ink)}
.nav a[aria-current="page"]::after{content:"";position:absolute;left:10px;right:10px;bottom:-7px;height:2px;background:var(--ink)}
@media (max-width:640px){.mark span{font-size:13px}.nav a{padding:5px 7px;font-size:13px}.nav .wip5{display:none}.nav a[aria-current="page"]::after{bottom:0;left:7px;right:7px}}

/* ---------- shared view chrome ---------- */
main{min-height:70vh;outline:0}
.view{padding-block:36px 56px}
.kicker{display:flex;flex-wrap:wrap;gap:4px 0;align-items:center;margin-bottom:14px}
.kicker .lab:not(:last-child)::after{content:"·";margin:0 9px;color:var(--ink-3)}
.h-xl{font-size:clamp(32px,4.6vw,54px);font-weight:800;line-height:1.02;letter-spacing:-.025em;font-stretch:105%}
.h-l{font-size:clamp(26px,3.4vw,38px);font-weight:750;line-height:1.08;letter-spacing:-.02em}
.h-m{font-size:clamp(20px,2.4vw,26px);line-height:1.15}
.h-claim{font-size:clamp(24px,3vw,34px);font-weight:750;line-height:1.1;letter-spacing:-.018em;max-width:26em}
.deck{font-family:var(--f-text);font-size:clamp(17px,1.7vw,20px);line-height:1.5;color:var(--ink-2);max-width:62ch;margin-top:16px}
.deck b,.deck strong{color:var(--ink);font-weight:600}
.sect{padding-top:48px}
.sect-head{display:grid;grid-template-columns:minmax(0,1fr);gap:8px;margin-bottom:22px}
.sect-head>h2{max-width:24em}.sect-head>p{max-width:74ch}
.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--ink);border-radius:999px;padding:7px 14px;font-size:13.5px;font-weight:600;background:transparent;color:var(--ink);text-decoration:none;white-space:nowrap}
.btn:hover{background:var(--ink);color:var(--paper)}
.btn.ghost{border-color:var(--rule);color:var(--ink-2);font-weight:500}
.btn.ghost:hover{background:var(--surface-2);color:var(--ink)}
.btn[disabled]{opacity:.4;pointer-events:none}
.chip{display:inline-flex;align-items:center;gap:6px;font-family:var(--f-mono);font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;border:1px solid var(--rule);border-radius:3px;padding:1px 6px;color:var(--ink-2);white-space:nowrap;background:var(--surface)}
.go{font-family:var(--f-display);font-size:13.5px;font-weight:600;color:var(--accent);text-decoration:none;white-space:nowrap}
.go:hover{text-decoration:underline}
.note{font-size:14px;color:var(--ink-2);line-height:1.5;max-width:84ch}
.note a,.srcline a{color:inherit}

/* signal bars: how well a link is measured */
.sig{display:inline-flex;align-items:flex-end;gap:2px;height:14px;vertical-align:-2px}
.sig i{width:4px;border-radius:1px;background:var(--rule)}
.sig i:nth-child(1){height:5px}.sig i:nth-child(2){height:8px}.sig i:nth-child(3){height:11px}.sig i:nth-child(4){height:14px}
.sig[data-l="1"] i:nth-child(-n+1),.sig[data-l="2"] i:nth-child(-n+2),.sig[data-l="3"] i:nth-child(-n+3),.sig[data-l="4"] i:nth-child(-n+4){background:var(--ink)}
.sig[data-l="0"] i{background:transparent;outline:1px dashed var(--ink-3);outline-offset:-1px}

/* ---------- home: hero + map ---------- */
.hero{padding-block:26px 0}
.herogrid{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:18px 56px;align-items:end}
.herogrid .deck{margin-top:0;padding-bottom:4px}
@media (max-width:900px){.herogrid{grid-template-columns:1fr}}
.mapwrap{margin-top:22px;border-top:1px solid var(--ink);border-bottom:1px solid var(--rule);background:var(--surface)}
.mapin{padding-inline:0;max-width:1240px}
.map{position:relative}
.map svg{display:block;width:100%;height:auto}
.map text.halo{paint-order:stroke;stroke:var(--surface);stroke-width:4px;stroke-linejoin:round}
.map .seg,.map .st,.map .mech,.map .key,.map .zone,.map .jn{transition:opacity .25s}
.map .st{cursor:pointer}
.map .st .ring{fill:var(--surface);transition:stroke-width .15s}
.map .st .hit{fill:transparent}
.map .st .nm{font-family:var(--f-display);font-weight:680;font-size:14.5px;fill:var(--ink)}
.map .st .big{font-family:var(--f-display);font-weight:780;font-size:25px;letter-spacing:-.02em;fill:var(--ink)}
.map .st .big.zero{fill:var(--map-bg);stroke:var(--ink);stroke-width:1.5px;font-size:27px}
.mlv.zero{color:transparent;-webkit-text-stroke:1.4px var(--ink)}
.map .st .val{font-family:var(--f-mono);font-size:10.5px;fill:var(--ink-2)}
.map .st .q{font-family:var(--f-display);font-size:22px;font-weight:750;fill:var(--ink-2)}
.map .st:hover .ring,.map .st:focus-visible .ring,.map .st.on .ring{stroke-width:7}
.map .st .core{opacity:0;fill:var(--ink);transition:opacity .15s}
.map .st.on .core,.map .st:hover .core{opacity:1}
.map .st:focus-visible{outline:0}
.map .st:focus-visible .nm,.map .st:hover .nm{text-decoration:underline}
.map .mech{font-family:var(--f-mono);font-size:10.5px;fill:var(--ink-3);letter-spacing:.02em}
.map .zlab{font-family:var(--f-mono);font-size:11.5px;letter-spacing:.16em;fill:var(--ink-2);font-weight:500}
.map .zlab.strong{fill:var(--ink);font-size:12.5px;font-weight:600}
.map .jn{fill:var(--ev3)}
.map .keyt{font-family:var(--f-display);font-size:12.5px;fill:var(--ink-2)}
.map.touring .seg,.map.touring .st,.map.touring .mech,.map.touring .key,.map.touring .jn{opacity:.32}
.map.touring .zone{opacity:.55}
.map.touring .seg.lit,.map.touring .st.lit,.map.touring .zone.lit{opacity:1}
.tourbox{position:absolute;left:1.8%;bottom:4.5%;width:min(44%,500px)}
.tourstart{display:flex;gap:12px;align-items:center;font-size:13px;color:var(--ink-2);line-height:1.35}
.tourbox.on{background:var(--surface);border:1.5px solid var(--ink);padding:12px 14px 12px;box-shadow:0 6px 20px rgba(8,20,32,.10)}
.tourtop{display:flex;justify-content:space-between;gap:10px;align-items:center}
.tourtop .dots{display:inline-flex;gap:4px}
.tourtop .dots i{width:6px;height:6px;border-radius:50%;border:1px solid var(--ink-3)}
.tourtop .dots i.done{background:var(--ink-3)}.tourtop .dots i.on{background:var(--ink);border-color:var(--ink)}
.tourname{font-weight:700;font-size:18px;margin-top:2px}
.tourbox p{font-family:var(--f-text);font-size:15px;line-height:1.4;color:var(--ink-2);margin-top:2px}
.tourbox .ctl{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.tourbox .ctl .btn{padding:5px 11px;font-size:12.5px}
.tourbox .ctl .x{margin-left:auto}
.maplead,.maplist,.mapkey2{display:none}
.mapnotes{display:grid;grid-template-columns:1.25fr 1.25fr 1fr;gap:14px 40px;padding:16px 20px 20px;border-top:1px solid var(--rule);font-family:var(--f-text);font-size:15.5px;line-height:1.5;color:var(--ink-2)}
.mapnotes b{font-family:var(--f-display);font-size:13.5px;color:var(--ink)}
@media (max-width:900px){.mapnotes{grid-template-columns:1fr}}
.counter{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.6fr);gap:14px 48px;margin-top:8px;padding-top:20px;border-top:1px solid var(--rule)}
.counter p{font-family:var(--f-text);font-size:16.5px;line-height:1.5;color:var(--ink-2);margin-top:6px}
.counter ol{margin:0;padding:0;list-style:none;counter-reset:c;columns:2 260px;column-gap:36px}
.counter li{counter-increment:c;font-family:var(--f-text);font-size:15.5px;line-height:1.45;color:var(--ink-2);padding:0 0 12px 26px;position:relative;break-inside:avoid}
.counter li::before{content:counter(c);position:absolute;left:0;top:1px;font-family:var(--f-mono);font-size:11.5px;color:var(--ink-3)}
.counter li b{color:var(--ink);font-weight:600;font-family:var(--f-display);font-size:14.5px}
@media (max-width:820px){.counter{grid-template-columns:1fr}}
.maplead{font-size:14px;color:var(--ink-2);padding:14px 20px 4px;max-width:60ch}
.maplead b{color:var(--ink)}
.maplist{list-style:none;margin:0;padding:6px 0 0}
.maplist ol{list-style:none;margin:0;padding:0}
.maplist li>button{display:grid;grid-template-columns:72px minmax(0,1fr) auto;gap:2px 12px;align-items:center;width:100%;padding:12px 20px 12px 14px;border-top:1px solid var(--grid);border-left:9px solid var(--ev4);margin-left:20px;width:calc(100% - 20px)}
.maplist li[data-l="3"]>button{border-left:5px solid var(--ev3);margin-left:22px;width:calc(100% - 22px)}
.maplist li[data-l="2"]>button{border-left:6px double var(--ev2);margin-left:22px;width:calc(100% - 22px)}
.maplist li[data-l="1"]>button{border-left:5px dotted var(--ev1);margin-left:22px;width:calc(100% - 22px)}
.maplist li[data-l="0"]>button{border-left:0;margin-left:0;width:100%;padding-left:36px;background:repeating-linear-gradient(45deg,transparent 0 6px,var(--grid) 6px 7.5px)}
.mlv{font-size:22px;font-weight:780;letter-spacing:-.02em;text-align:right;line-height:1}
.mln b{display:block;font-size:15px;font-weight:680;line-height:1.25}
.mln span{font-family:var(--f-mono);font-size:11px;color:var(--ink-2);line-height:1.3;display:block}
.maplist .fork{padding:9px 20px 7px;border-top:1px solid var(--rule);background:var(--surface-2)}
.maplist .fork.end{border-top:1px solid var(--ink-3)}
.maplist .grp>.lab{display:block;padding:10px 20px 4px 44px;border-top:1px solid var(--grid);color:var(--ink-2)}
.maplist .grp li:first-child>button{border-top:0}
.mapkey2{flex-wrap:wrap;gap:6px 18px;padding:12px 20px 14px;border-top:1px solid var(--grid);font-size:12.5px;color:var(--ink-2);align-items:center}
.mapkey2 .lab{flex-basis:100%}
.mapkey2 .k{display:inline-flex;align-items:center;gap:8px}
@media (max-width:979px){.map{display:none}.maplead{display:block}.maplist{display:block}.mapkey2{display:flex}}

/* verdict + findings */
.view3{margin-top:0}
.view3 p{font-family:var(--f-text);font-size:16.5px;line-height:1.5;color:var(--ink-2)}
.view3 h3{font-size:17px;gap:10px}
.view3>section{padding-bottom:18px}
.findings{display:grid;gap:0;border-top:1px solid var(--ink)}
.finding{display:grid;grid-template-columns:44px minmax(0,1.35fr) minmax(0,1fr);gap:10px 32px;padding:24px 0;border-bottom:1px solid var(--rule);align-items:center}
.finding .n{font-family:var(--f-mono);font-size:12px;color:var(--ink-3);align-self:start;padding-top:5px}
.finding h3{font-size:clamp(18px,2vw,22px);line-height:1.18;font-weight:700}
.finding p{font-family:var(--f-text);font-size:16.5px;line-height:1.5;color:var(--ink-2);margin-top:8px;max-width:60ch}
.finding .links{display:flex;gap:14px;flex-wrap:wrap;margin-top:10px}
.finding .thumb{min-width:0}
@media (max-width:760px){.finding{grid-template-columns:28px minmax(0,1fr)}.finding .thumb{grid-column:2}}
.thumbcap{font-family:var(--f-mono);font-size:10.5px;color:var(--ink-3);letter-spacing:.03em;margin-top:2px;display:block}
.duo{display:flex;gap:30px;align-items:flex-end;padding:10px 0 6px}
.duo b{display:block;font-size:38px;font-weight:780;letter-spacing:-.025em;line-height:1}
.duo b.zero{color:transparent;-webkit-text-stroke:1.5px var(--ink)}
.duo .thumbcap{margin-top:6px}

/* ---------- evidence index ---------- */
.idxhead{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,400px);gap:20px 60px;align-items:end}
.idxhead .glyph{display:block;opacity:.9}
.idxhead .glyph svg{display:block;width:100%;height:auto}
@media (max-width:900px){.idxhead{grid-template-columns:1fr}.idxhead .glyph{display:none}}
.idx{border-top:1px solid var(--ink);margin-top:26px}
.idx a{display:grid;grid-template-columns:30px 168px 200px minmax(0,1fr) 18px;gap:6px 24px;padding:18px 0;border-bottom:1px solid var(--rule);text-decoration:none;color:inherit;align-items:start}
.idx a:hover{background:var(--surface)}
.idx .n{font-family:var(--f-mono);font-size:12px;color:var(--ink-3);padding-top:4px}
.idx .nm{font-weight:700;font-size:16.5px;line-height:1.2}
.idx .mt{font-size:12.5px;font-weight:400;color:var(--ink-2);display:block;margin-top:6px}
.idx .bg b{display:block;font-size:26px;font-weight:780;letter-spacing:-.02em;line-height:1}
.idx .bg span{display:block;font-family:var(--f-mono);font-size:11px;color:var(--ink-2);line-height:1.35;margin-top:5px}
.idx .cl{font-family:var(--f-text);font-size:16.5px;line-height:1.45}
.idx .dir{display:block;font-family:var(--f-display);font-size:12.5px;color:var(--ink-3);margin-top:6px}
.idx .ar{color:var(--ink-3);padding-top:2px}
@media (max-width:900px){.idx a{grid-template-columns:28px minmax(0,1fr) 18px}.idx .bg,.idx .cl{grid-column:2}.idx .ar{grid-row:1;grid-column:3}}

/* ---------- link page ---------- */
.crumbs{display:flex;gap:0;overflow-x:auto;border-bottom:1px solid var(--rule);margin-bottom:26px;scrollbar-width:thin}
.crumbs a{flex:1 0 auto;display:flex;flex-direction:column;gap:5px;padding:10px 14px 9px 0;margin-right:14px;text-decoration:none;color:var(--ink-3);font-size:12.5px;font-weight:500;white-space:nowrap;border-bottom:3px solid transparent;margin-bottom:-1px}
.crumbs a .ln{display:block;height:6px;border-radius:3px;background:var(--ev4);min-width:44px}
.crumbs a[data-l="3"] .ln{height:4px;margin:1px 0;background:var(--ev3)}
.crumbs a[data-l="2"] .ln{height:4px;margin:1px 0;background:transparent;border:1.4px solid var(--ev2)}
.crumbs a[data-l="1"] .ln{height:4px;margin:1px 0;background:radial-gradient(circle,var(--ev1) 1.9px,transparent 2.2px) 0 0/9px 4px repeat-x;border-radius:0}
.crumbs a[data-l="0"] .ln{height:2px;margin:2px 0;background:radial-gradient(circle,var(--ev0) 1px,transparent 1.2px) 0 0/6px 2px repeat-x;border-radius:0}
.crumbs a:hover{color:var(--ink)}
.crumbs a[aria-current="page"]{color:var(--ink);font-weight:700;border-bottom-color:var(--ink)}
.claimgrid{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:20px 48px;align-items:start}
@media (max-width:900px){.claimgrid{grid-template-columns:1fr}}
.verdict{border-left:1px solid var(--rule);padding-left:22px;display:grid;gap:9px;font-size:13.5px;margin:0}
@media (max-width:900px){.verdict{border-left:0;padding-left:0;border-top:1px solid var(--rule);padding-top:14px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}}
.verdict dt{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);margin-bottom:1px}
.verdict dd{margin:0;font-weight:600;line-height:1.3}
.verdict dd small{display:block;font-weight:400;color:var(--ink-2);font-size:12.5px;margin-top:1px}
.figwrap{margin-top:28px}
.tabs{display:grid;grid-template-columns:repeat(var(--n,4),minmax(0,1fr));grid-template-rows:auto auto auto;position:relative;z-index:1}
.tab{display:grid;grid-template-rows:subgrid;grid-row:span 3;gap:3px;padding:10px 14px 12px;border:2px solid transparent;border-bottom:0;box-shadow:-1px 0 0 var(--rule);min-width:0;align-content:start}
.tab:first-child{box-shadow:none}

   ====================================================================================== */
:root{
  /* "What the data show": one teal hue, dark = more change. Grey is NOT a step: it means "can't tell".
     Light steps OKLCH L .40/.515/.625/.735 (ordinal check passes; lightest 2.04:1 on --paper). */
  --sg4:#00544d; --sg3:#00786e; --sg2:#329a8f; --sg1:#6dbab0; --sg0:#8f9ca8;
  --coverage-major:#b12b38; --coverage-partial:#9b570b; --coverage-stronger:#14704d; --map-path:#8593a0;
  /* human side (Skills and judgement, Human influence): an annotation colour, never a data colour */
  --hs:var(--accent); --hs-soft:var(--accent-soft); --hs-line:var(--accent-soft);
  /* spacing and type (17_ux_spec §4) */
  --gap-section:clamp(72px,9vw,128px); --gap-section-sm:clamp(56px,7vw,96px); --gap-hero:clamp(48px,6vw,80px);
  --gap-head:28px; --gap-stack:16px; --gap-tight:8px; --pad-card:clamp(20px,2.4vw,32px); --gutter:clamp(16px,4vw,40px);
  --t-xs:.6875rem; --t-sm:.8125rem; --t-base:1rem; --t-prose:1.0625rem; --t-lead:clamp(1.1875rem,1.6vw,1.375rem);
  --t-h3:clamp(1.0625rem,1.4vw,1.25rem); --t-h2:clamp(1.75rem,3.2vw,2.5rem); --t-h1:clamp(2.125rem,4.6vw,3.5rem);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  /* reversed: more change = lighter = more contrast on the dark surface. Lightest-contrast step 3.0:1 on --paper. */
  --sg4:#7ee7d9; --sg3:#47c3b5; --sg2:#329a8f; --sg1:#2e6c65; --sg0:#66747f;
  --coverage-major:#ff8e98; --coverage-partial:#efbb64; --coverage-stronger:#72d5a5; --map-path:#7f8e9b;
  --hs:var(--accent); --hs-soft:var(--accent-soft); --hs-line:var(--accent-soft); } }
:root[data-theme="dark"]{
  --sg4:#7ee7d9; --sg3:#47c3b5; --sg2:#329a8f; --sg1:#2e6c65; --sg0:#66747f;
  --coverage-major:#ff8e98; --coverage-partial:#efbb64; --coverage-stronger:#72d5a5; --map-path:#7f8e9b;
  --hs:var(--accent); --hs-soft:var(--accent-soft); --hs-line:var(--accent-soft); }

.sr5{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
.hs5tag{display:inline-flex;align-items:center;gap:5px;font-family:var(--f-display);font-size:11.5px;font-weight:600;color:var(--hs);letter-spacing:.01em;white-space:nowrap}
.hs5tag::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--hs)}

/* ---------------- 1. map ---------------- */
.mapcard5{background:var(--surface);border-top:1px solid var(--ink);border-bottom:1px solid var(--rule);--map-bg:var(--surface);--glyph-bg:var(--surface)}
.map5{position:relative;max-width:1240px;margin:0 auto}
.map5 svg{display:block;width:100%;height:auto;max-height:480px}
.map5 text{font-family:var(--f-display)}
.map5 .zl5{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.14em;fill:var(--ink-3)}
.map5 .halo5{paint-order:stroke;stroke:var(--surface);stroke-width:5px;stroke-linejoin:round}
.map5 .hs5lab{font-family:var(--f-mono);font-size:10px;letter-spacing:.14em;fill:var(--hs);font-weight:500}
.map5 .nm5{font-weight:650;font-size:14.5px;fill:var(--ink)}
.map5 .q5{font-size:20px;font-weight:750;fill:var(--ink-2)}
.map5 .st5{cursor:pointer;outline:0}
.map5 .st5 .core5{fill:var(--ink);opacity:0;transition:opacity .15s}
.map5 .st5:hover .core5,.map5 .st5:focus-visible .core5{opacity:1}
.map5 .st5:hover .nm5,.map5 .st5:focus-visible .nm5{text-decoration:underline;text-underline-offset:3px}
.map5 .hit5{fill:none;stroke:transparent;stroke-width:24;stroke-linecap:round;stroke-linejoin:round;pointer-events:stroke;cursor:pointer}
.map5 .sh5{outline:0;cursor:pointer}
.map5 .sh5:focus-visible .hit5{stroke:color-mix(in srgb,var(--accent) 20%,transparent)}
.map5 .badge5 circle{fill:var(--surface);stroke:var(--ink-2);stroke-width:1.3;transition:fill .15s}
.map5 .badge5 text{font-family:var(--f-text);font-style:italic;font-weight:700;font-size:12.5px;fill:var(--ink-2)}
.map5 .sh5:hover .badge5 circle,.map5 .sh5:focus-visible .badge5 circle,.map5 .sh5.sel .badge5 circle{fill:var(--ink);stroke:var(--ink)}
.map5 .sh5:hover .badge5 text,.map5 .sh5:focus-visible .badge5 text,.map5 .sh5.sel .badge5 text{fill:var(--surface)}
.map5 .seg5,.map5 .st5,.map5 .jn5{transition:opacity .2s}
.map5.has-sel .seg5:not(.sel){opacity:.25}
.map5.has-sel .st5:not(.sel){opacity:.55}
.mkey5{display:flex;flex-wrap:wrap;align-items:center;gap:6px 18px;padding:12px 20px 2px;font-size:12.5px;color:var(--ink-2);max-width:1240px;margin:0 auto}
.mk5-t{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)}
.mk5-i{display:inline-flex;align-items:center;gap:7px;white-space:nowrap}
.mk5-hint{margin-left:auto;display:inline-flex;align-items:center;gap:7px;color:var(--ink-2);font-weight:500}
.ib5{width:18px;height:18px;border-radius:50%;border:1.3px solid var(--ink-2);display:inline-grid;place-items:center;font:italic 700 12px/1 var(--f-text);color:var(--ink-2)}
.mcav5{padding:4px 20px 14px;font-size:12.5px;color:var(--ink-3);max-width:1240px;margin:0 auto}
/* drawer */
.md5{display:grid;grid-template-rows:0fr;transition:grid-template-rows .2s ease;max-width:1240px;margin:0 auto}
.md5.open{grid-template-rows:1fr}
.md5-in{overflow:hidden;min-height:0}
.md5-pad{border-top:1px solid var(--rule);padding:16px 20px 20px;max-height:300px}
.md5-head{display:flex;justify-content:space-between;align-items:center;gap:12px}
.md5-head h3{font-size:17px;font-weight:700;line-height:1.25}
.md5-head h3 span{color:var(--ink)}
.md5-x{width:30px;height:30px;display:grid;place-items:center;border-radius:50%;color:var(--ink-2);flex:0 0 auto}
.md5-x:hover{background:var(--surface-2);color:var(--ink)}
.md5-grid{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:14px 40px;margin-top:10px;align-items:start}
.md5-cap{font-size:12px;color:var(--ink-3);margin-bottom:6px}
.rs5{display:block;overflow:visible}
.rs5 text{font-family:var(--f-mono);font-size:10px;fill:var(--ink-3)}
.rs5 .nd5{font-size:9.5px;letter-spacing:.1em;fill:var(--ink-2)}
.rb5{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:1fr 1fr;gap:12px 18px;padding-top:20px}
.rb5 li{display:flex;gap:8px;align-items:flex-start;font-size:14px;font-weight:600;line-height:1.25}
.rb5-m{flex:0 0 auto;width:20px;height:20px;border-radius:50%;display:inline-grid;place-items:center;font-size:12px;font-weight:700;line-height:1;margin-top:-1px}
.rb5-2 .rb5-m{background:var(--accent);color:var(--surface)}
.rb5-1 .rb5-m{background:var(--accent-soft);color:var(--accent)}
.rb5-0 .rb5-m{border:1.5px solid var(--ink-3);color:var(--ink-3)}
.rb5-0 .rb5-l{color:var(--ink-2)}
.md5-head h3:focus{outline:none}
.rb5 small{display:block;font-weight:400;color:var(--ink-3);font-size:12.5px;margin-top:2px}
.md5-note{margin-top:14px;font-family:var(--f-text);font-size:15.5px;line-height:1.45;color:var(--ink-2)}
/* phone list */
.mlist5{display:none;list-style:none;margin:0;padding:6px 0 4px}
.ml5{display:grid;grid-template-columns:20px minmax(0,1fr);gap:0 14px;align-items:start;padding:0 16px;min-height:52px}
.ml5-line{align-self:stretch;position:relative}
.ml5-line::before{content:"";position:absolute;left:50%;top:0;bottom:0;transform:translateX(-50%)}
.ml5[data-l="4"] .ml5-line::before{width:7px;background:var(--ev4)}
.ml5[data-l="3"] .ml5-line::before{width:4.5px;background:var(--ev3)}
.ml5[data-l="2"] .ml5-line::before{width:6px;border-left:1.6px solid var(--ev2);border-right:1.6px solid var(--ev2)}
.ml5[data-l="1"] .ml5-line::before{width:6px;background:radial-gradient(circle,var(--ev1) 2.4px,transparent 2.8px) center 2px/6px 10px repeat-y}
.ml5[data-l="0"] .ml5-line::before{width:4px;background:radial-gradient(circle,var(--ev0) 1.2px,transparent 1.5px) center 0/4px 7px repeat-y}
.ml5-main{display:flex;flex-wrap:wrap;gap:2px 10px;align-items:baseline;padding:13px 0}
.ml5-name{font-weight:650;font-size:15.5px;color:var(--ink)}
.ml5-why{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:500;color:var(--ink-2);padding:0 2px 0 8px;min-height:44px;white-space:nowrap}
.ml5-why .ib5{width:16px;height:16px;font-size:11px}
.ml5-why:hover{color:var(--ink);text-decoration:underline}
.ml5-why[aria-expanded="true"]{color:var(--ink);font-weight:650}
.ml5.hs{background:var(--hs-soft)}
.ml5-fork{padding:10px 16px 8px 50px;font-size:12px;color:var(--ink-3);border-top:1px solid var(--grid);border-bottom:1px solid var(--grid)}
.ml5>.md5{grid-column:1/-1;margin:0 -16px}
.ml5>.md5 .md5-pad{padding:14px 16px 16px;max-height:none;background:var(--surface)}
.ml5>.md5 .md5-grid{grid-template-columns:1fr}
.ml5>.md5 .rb5{padding-top:0}
@media (max-width:979px){.map5{display:none}.mlist5{display:block}.mk5-hint{display:none}.mkey5{padding:12px 16px 2px;gap:6px 14px}.mcav5{padding:4px 16px 14px}}

/* ---------------- 2. evidence rows ---------------- */
.sgd5{width:12px;height:12px;border-radius:50%;background:var(--c);display:inline-block;flex:0 0 auto}
.sgd5.q{background:transparent;width:15px;height:15px;border:1.5px dashed var(--sg0);display:inline-grid;place-items:center;font:normal 700 9px/1 var(--f-display);color:var(--ink-2)}
.elg5{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center;font-size:13px;color:var(--ink-2);padding-bottom:14px}
.elg5-t{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)}
.elg5-i{display:inline-flex;gap:7px;align-items:center;white-space:nowrap}
.elg5-n{margin-left:auto;font-size:12px;color:var(--ink-3)}
.er5-list{border-top:1px solid var(--ink)}
.er5{--glyph-bg:var(--paper);position:relative;display:grid;grid-template-columns:minmax(0,1.1fr) 56px 196px minmax(0,2fr) 18px;gap:4px 24px;align-items:center;min-height:70px;padding:16px 8px 16px 26px;border-bottom:1px solid var(--rule);text-decoration:none;color:inherit;transition:background .15s}
.er5::before{content:"";position:absolute;left:0;top:-1px;bottom:0;width:6px;background:var(--band);transition:width .15s}
.er5.q::before{width:3px;left:1.5px;background:repeating-linear-gradient(180deg,var(--sg0) 0 5px,transparent 5px 9px)}
.er5:hover{background:var(--surface);--glyph-bg:var(--surface)}
.er5:hover::before{width:10px}
.er5.q:hover::before{width:3px}
.er5:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.er5-nm{font-weight:700;font-size:16.5px;line-height:1.2;display:flex;flex-direction:column;gap:4px;align-items:flex-start}
.er5-gl{display:flex;align-items:center}
.er5-sg{display:inline-flex;gap:9px;align-items:center;font-size:14px;font-weight:600;line-height:1.2}
.er5-one{font-family:var(--f-text);font-size:16px;color:var(--ink-2);line-height:1.4}
.er5 .chev5,.ic5 .chev5{color:var(--ink-3);transition:transform .15s,color .15s}
.er5:hover .chev5{transform:translateX(3px);color:var(--ink)}
@media (max-width:760px){
  .er5{grid-template-columns:minmax(0,1fr) auto 14px;gap:6px 12px;padding:14px 2px 14px 18px;min-height:0}
  .er5-gl{display:none}.er5-nm{grid-column:1;grid-row:1;font-size:16px}.er5-sg{grid-column:2;grid-row:1;font-size:13px}
  .er5-one{grid-column:1/3;grid-row:2;font-size:15px}.er5 .chev5{grid-column:3;grid-row:1/3}
  .elg5{gap:8px 14px}.elg5-n{margin-left:0;flex-basis:100%}}

/* ---------------- 3. indicator cards ---------------- */
.ic5-head{display:flex;flex-wrap:wrap;justify-content:space-between;gap:6px 24px;align-items:baseline;margin-bottom:12px}

.ic5-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.ic5{--glyph-bg:var(--paper);position:relative;display:grid;grid-template-columns:minmax(0,1fr) 14px;grid-template-areas:"top top" "lab chev" "tr chev";gap:6px 8px;min-height:112px;padding:14px 14px 12px 16px;border:1px solid var(--rule);border-radius:6px;background:var(--paper);text-align:left;align-content:start;transition:border-color .15s,background .15s}

.ic5-panel{grid-column:1/-1;position:relative;background:var(--surface);border-top:2px solid var(--ink);border-bottom:1px solid var(--rule);padding:22px 24px 18px;--halo:var(--surface);outline:0}
.ic5-panel::before{content:"";position:absolute;top:-8.5px;left:var(--nx,50%);width:13px;height:13px;background:var(--surface);border-left:2px solid var(--ink);border-top:2px solid var(--ink);transform:translateX(-50%) rotate(45deg)}
.ic5-ph{display:flex;justify-content:space-between;gap:10px 24px;align-items:flex-start;flex-wrap:wrap}

@media (max-width:900px){.ic5-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:640px){
  .ic5-grid{grid-template-columns:1fr;gap:8px}

  .ic5.on{padding:9px 11px}
  .ic5-top{flex-direction:column;align-items:flex-start;gap:4px;margin:0}
  .ic5 .tw5{right:30px;top:11px}
  .ic5-lab{padding-right:16px}

/* ---------------- 4. insight cards ---------------- */

/* ---------------- 6. caveat signposts, WIP ---------------- */
.cav5w{position:relative;display:inline-flex;vertical-align:middle}
.cav5{display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 9px 0 7px;border-radius:12px;background:var(--surface-2);border:1px solid var(--rule);font-family:var(--f-display);font-size:12.5px;font-weight:500;color:var(--ink-2);white-space:nowrap;cursor:help;line-height:1}
.cav5 svg{flex:0 0 auto}
.cav5:hover,.cav5w.open .cav5{color:var(--ink);border-color:var(--ink-3)}
.cav5tip{position:absolute;top:calc(100% + 6px);left:0;transform:translateX(var(--dx,0px));z-index:30;width:max-content;max-width:240px;background:var(--surface);border:1px solid var(--ink);border-radius:4px;padding:8px 10px;font-size:13px;line-height:1.4;color:var(--ink);box-shadow:0 4px 14px rgba(8,20,32,.14);display:none;white-space:normal;text-align:left;font-weight:400}
.cav5w.open .cav5tip{display:block}
.cav5tip a{display:block;margin-top:4px;font-weight:600;color:var(--accent);text-decoration:none}
.cav5tip a:hover{text-decoration:underline}
.wip5{display:inline-flex;align-items:center;height:22px;padding:0 8px;font-family:var(--f-mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2);border:1px dashed var(--ink-3);border-radius:3px;background:repeating-linear-gradient(45deg,transparent 0 3px,color-mix(in srgb,var(--ink) 8%,transparent) 3px 4px);white-space:nowrap;line-height:1}
.wipban5{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;min-height:40px;padding:8px 14px;border:1px dashed var(--ink-3);border-radius:4px;font-size:14px;color:var(--ink-2)}
.fig5{margin-top:16px;padding:20px 22px 16px;--halo:var(--paper)}
.fig5.wip{border:1.5px dashed var(--rule);background:transparent;border-radius:6px}
.fig5.wip h3{color:var(--ink-2);font-size:clamp(17px,1.9vw,20px);line-height:1.22;max-width:30em}
.fig5.wip .chart svg{filter:saturate(.8)}
.fig5-h{display:flex;justify-content:space-between;gap:10px 16px;align-items:flex-start;flex-wrap:wrap}
.fig5-n{font-size:12.5px;color:var(--ink-3);margin-top:8px}
@media (prefers-reduced-motion:reduce){.md5,.er5,.er5::before,.ic5,.in5-row i::before,.in5-row i::after{transition:none!important}}


/* indicator grid: three cards by default, the rest behind one button */
.ic5[hidden]{display:none}
.ic5-all{margin-top:12px}
.ic5-all[hidden]{display:none}
.ic5-dir{font-size:12.5px;color:var(--ink-2);margin-right:4px}
/* ======================================================================================
   pages.css: page layout. Spacing and type tokens live in components.css (:root).
   Three levels per view: heading, card/row title, body. Space separates sections, not rules.
   ====================================================================================== */
.view5{padding-block:clamp(36px,5vw,64px) clamp(72px,8vw,112px)}
.eye5{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;margin-bottom:16px;font-family:var(--f-mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)}
.eye5>i{font-style:normal;color:var(--ink-3)}
.eye5 .hs5tag,.eye5 .tag5,.eye5 .wip5{text-transform:none;letter-spacing:.01em}
.eye5 .wip5{text-transform:uppercase}
.cav5.draft5{height:20px;padding:0 8px;font-size:11.5px;font-weight:600;letter-spacing:.01em;text-transform:none;border-style:dashed;border-color:var(--ink-3);background:transparent}
.cav5.why5{height:20px;padding:0 8px;font-size:12px;margin-left:4px}
.h1-5{font-size:var(--t-h1);font-weight:800;line-height:1.04;letter-spacing:-.025em;max-width:16em;font-stretch:104%}
.h1-5.xl{font-size:clamp(36px,4.3vw,56px);line-height:1.02;max-width:none}
.h1-5.c{font-size:clamp(27px,3.3vw,40px);font-weight:780;line-height:1.08;letter-spacing:-.02em;max-width:22em}
.lead5{font-family:var(--f-text);font-size:var(--t-lead);line-height:1.45;color:var(--ink-2);max-width:56ch;margin-top:18px}
.lead5.sm{font-size:clamp(17px,1.5vw,19px)}
.h2-5{font-size:clamp(25px,2.8vw,34px);font-weight:760;line-height:1.1;letter-spacing:-.018em;max-width:24em}
.h2-5.sm{font-size:clamp(21px,2.2vw,26px)}
.h3-5{font-size:17px;font-weight:700;line-height:1.25;margin-top:28px}
.h3-5:first-child{margin-top:0}
.sub5{font-size:15px;line-height:1.5;color:var(--ink-2);margin-top:8px;max-width:70ch}
.note5{font-size:13px;line-height:1.5;color:var(--ink-3);margin-top:16px;max-width:82ch}
.prose5{font-family:var(--f-text);font-size:17px;line-height:1.55;color:var(--ink-2);max-width:64ch;margin-top:12px}
.sec5{margin-top:var(--gap-section-sm)}
.s1{margin-top:28px}
.nums5{font-family:var(--f-mono);font-size:12px;letter-spacing:.02em;color:var(--ink-3);margin-top:20px}
.nums5 .go{font-family:var(--f-display);font-size:13px;margin-left:10px;letter-spacing:0}
.tag5{display:inline-flex;align-items:center;height:22px;padding:0 9px;border-radius:999px;font-family:var(--f-display);font-size:12px;font-weight:600;color:var(--hs);background:var(--hs-soft);border:1px solid var(--hs-line);white-space:nowrap}
.nav .wip5{height:16px;padding:0 4px;font-size:9.5px;margin-left:5px;vertical-align:1px}

/* ---------- home ---------- */
.hero5{padding-top:clamp(28px,3.6vw,48px);padding-bottom:clamp(32px,3.8vw,52px)}
.hero5-g{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:20px 56px;align-items:end}
.hero5-g .lead5{margin-top:0;padding-bottom:6px}
.summary5{padding-block:var(--gap-section-sm)}
.summary5-link{display:inline-block;margin-top:20px}
.snapshot5{display:grid;grid-template-columns:minmax(0,.82fr) minmax(0,1.18fr);gap:24px 56px;align-items:start}
.snapshot5 .sub5.big{font-family:var(--f-text);font-size:20px;line-height:1.45;max-width:42ch}
.snapshot5-l{list-style:none;margin:4px 0 0;padding:0;border-top:1px solid var(--ink)}
.snapshot5-l li{display:grid;grid-template-columns:96px minmax(0,150px) minmax(0,1fr);gap:8px 18px;align-items:baseline;padding:15px 0;border-bottom:1px solid var(--rule)}
.snapshot5-l span{font-family:var(--f-mono);font-size:10.5px;letter-spacing:0;text-transform:uppercase;color:var(--ink-3)}
.snapshot5-l b{font-size:15.5px;line-height:1.25}
.snapshot5-l p{font-family:var(--f-text);font-size:15.5px;line-height:1.42;color:var(--ink-2)}
.paper5{display:inline-block;margin-top:10px}
.chainlab5{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:12px}
.chainlab5-h{font-size:13px;color:var(--ink-3)}
.core5{padding-top:var(--gap-section);padding-bottom:var(--gap-section-sm)}
.core5-a{font-size:clamp(19px,2vw,24px);font-weight:600;line-height:1.3;color:var(--ink-3);max-width:34em}
.core5-b{font-size:clamp(28px,3.6vw,46px);font-weight:780;line-height:1.1;letter-spacing:-.02em;color:var(--ink);max-width:21em;margin-top:12px;text-wrap:balance}
mark.hs5m{color:inherit;background:linear-gradient(transparent 58%,var(--hs-line) 58%,var(--hs-line) 92%,transparent 92%);box-shadow:none;padding:0 .04em}
.grp5{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px;margin-top:clamp(36px,5vw,56px)}
.grp5-c{border-top:1px solid var(--rule);padding-top:16px;--glyph-bg:var(--paper)}
.grp5-h{display:flex;align-items:center;gap:10px;font-size:13px;font-weight:600;color:var(--ink-2)}
.grp5 ul{list-style:none;margin:12px 0 0;padding:0;display:grid;gap:6px}
.grp5 a{font-size:17px;font-weight:650;color:var(--ink);text-decoration:none}
.grp5 a:hover{text-decoration:underline;text-underline-offset:3px}
.grp5 a.hs::after{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--hs);margin-left:8px;vertical-align:2px}
.doors5{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;padding-bottom:var(--gap-section-sm)}
.doors5.three{grid-template-columns:repeat(3,minmax(0,1fr));padding-bottom:0}
.door5{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:8px;padding:22px 44px 22px 22px;border:1px solid var(--rule);border-radius:8px;background:var(--surface);color:var(--ink);text-decoration:none;min-height:150px;transition:border-color .15s}
.door5 b{font-size:18px;font-weight:720;line-height:1.2}
.door5>span:not(.tag5):not(.wip5){font-family:var(--f-text);font-size:15px;line-height:1.45;color:var(--ink-2)}
.door5 .chev5{position:absolute;right:18px;bottom:22px;color:var(--ink-3);transition:transform .15s}
.door5:hover{border-color:var(--ink)}
.door5:hover .chev5{transform:translateX(3px);color:var(--ink)}
.door5.pri{border:1.5px solid var(--hs);box-shadow:inset 0 4px 0 var(--hs)}
.door5.wip{border:1.5px dashed var(--rule);background:transparent}
.door5.wip b{color:var(--ink-2)}

/* ---------- evidence, record ---------- */
.foot5{display:flex;flex-wrap:wrap;gap:12px 32px;margin-top:28px}
.foot5 .go,.note5 .go{white-space:normal}
details.det5 summary{cursor:pointer;padding:16px 0;font-size:16px;font-weight:650;color:var(--ink);list-style:none;display:flex;align-items:center;gap:10px}
details.det5 summary::-webkit-details-marker{display:none}
details.det5 summary::before{content:"+";display:inline-grid;place-items:center;width:20px;height:20px;border:1px solid var(--rule);border-radius:50%;font-size:14px;font-weight:500;color:var(--ink-2);flex:0 0 auto}
details[open].det5 summary::before{content:"−"}

/* ---------- link pages ---------- */
.crumb5{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:13px;color:var(--ink-3);margin-bottom:28px}
.crumb5 a{color:var(--ink-2);text-decoration:none;font-weight:550}
.crumb5 a:hover{text-decoration:underline;color:var(--ink)}
.claim5{max-width:980px}
.pills5{margin:0;display:grid;gap:14px;min-width:230px;padding:16px 0 4px 22px;border-left:1px solid var(--rule)}
.pills5 dt{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)}
.pills5 dd{margin:5px 0 0;display:flex;align-items:center;gap:8px;font-size:15px;font-weight:620;--glyph-bg:var(--paper)}
.ic5-sub{font-size:13.5px;line-height:1.45;color:var(--ink-3);margin-top:6px;max-width:82ch}
.ic5-body{margin-top:6px}
details.ic5-more{margin-top:14px;border-top:1px solid var(--grid)}
details.ic5-more summary{cursor:pointer;padding:10px 0 4px;font-size:13.5px;font-weight:600;color:var(--ink-2);width:max-content;max-width:100%}
details.ic5-more summary:hover{color:var(--ink)}
details.ic5-more .ic5-read{margin-top:6px;padding-top:0;border-top:0}
.rs5 .ln5{font-family:var(--f-display);font-size:11.5px;fill:var(--ink-2);letter-spacing:0}
.md5-lv{font-size:12.5px;font-weight:500;color:var(--ink-3);margin-left:8px;font-family:var(--f-display)}
.pn5{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:var(--gap-section-sm);border-top:1px solid var(--rule)}
.pn5 a{display:flex;flex-direction:column;gap:4px;padding:20px 0;text-decoration:none;color:var(--ink)}
.pn5 a b{font-size:18px;font-weight:700}
.pn5 a:hover b{text-decoration:underline;text-underline-offset:3px}
.pn5 a.nx{text-align:right;align-items:flex-end;grid-column:2}

/* ---------- accordions (gap list, forecast lessons) ---------- */
.h2row5{display:flex;justify-content:space-between;align-items:flex-end;gap:16px 24px;flex-wrap:wrap}
.acc5{margin-top:12px}
.accg5{margin-top:32px;--glyph-bg:var(--paper)}
.accg5-h{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;padding-bottom:10px;border-bottom:1px solid var(--ink)}
.accg5-h a{font-size:15px;font-weight:700;color:var(--ink);text-decoration:none}
.accg5-h a:hover{text-decoration:underline}
.acc5-i{border-bottom:1px solid var(--rule)}
.acc5-b{display:grid;grid-template-columns:minmax(0,1fr) auto 14px;gap:8px 18px;align-items:center;width:100%;min-height:58px;padding:12px 0}
.acc5-t{font-size:16px;font-weight:620;line-height:1.3;color:var(--ink)}
.acc5-b:hover .acc5-t{text-decoration:underline;text-decoration-color:var(--ink-3);text-underline-offset:3px}
.acc5-m{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.acc5-c{font-size:12px;color:var(--ink-2);border:1px solid var(--rule);border-radius:999px;padding:2px 9px;white-space:nowrap}
.acc5-b i{position:relative;width:12px;height:12px}
.acc5-b i::before,.acc5-b i::after{content:"";position:absolute;left:0;top:5.2px;width:12px;height:1.6px;border-radius:1px;background:var(--ink-2);transition:transform .15s}
.acc5-b i::after{transform:rotate(90deg)}
.acc5-b[aria-expanded="true"] i::after{transform:rotate(0)}
.acc5-p{padding:2px 0 22px}
.acc5-p dl{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px 28px;margin:0}
.acc5-p dt{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)}
.acc5-p dd{margin:6px 0 0;font-family:var(--f-text);font-size:15.5px;line-height:1.45;color:var(--ink-2)}
.acc5-p>p{font-family:var(--f-text);font-size:16px;line-height:1.5;color:var(--ink-2);max-width:72ch}
.acc5.plain .acc5-b{grid-template-columns:minmax(0,1fr) 14px}

.two5{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:40px 64px;align-items:start}

/* ---------- futures (work in progress) ---------- */
.fut5p .h1-5{color:var(--ink-2)}
.fut5p .wipban5{margin-top:22px;max-width:880px}
.fut5p .fig5{margin-top:0}
.fut5p .split{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.fut5p .route{opacity:.95}

/* ---------- method ---------- */
.toc5{display:flex;flex-wrap:wrap;gap:8px;margin-top:28px}
.toc5 a{font-size:13px;font-weight:550;color:var(--ink-2);text-decoration:none;border:1px solid var(--rule);border-radius:999px;padding:5px 12px}
.toc5 a:hover{border-color:var(--ink);color:var(--ink)}
.callout5{border-left:3px solid var(--ink);background:var(--surface);padding:16px 20px;max-width:880px}
.callout5 b{display:block;font-size:15px}
.callout5 p{font-family:var(--f-text);font-size:16px;line-height:1.5;color:var(--ink-2);margin-top:4px}
.scale5{list-style:none;margin:18px 0 0;padding:0;--glyph-bg:var(--paper)}
.scale5 li{display:grid;grid-template-columns:52px minmax(0,1fr);gap:4px 14px;align-items:start;padding:12px 0;border-top:1px solid var(--grid)}
.scale5 li>svg,.scale5-d{margin-top:4px}
.scale5 li b{display:block;font-size:15px}
.scale5 li span{display:block;font-size:14px;line-height:1.45;color:var(--ink-2)}
.scale5 li>div:only-child{grid-column:1/-1}
.scale5 li>div:only-child span.chip{display:inline-flex}
.scale5 li>div:only-child span:not(.chip){margin-top:5px}
.lim5 li{grid-template-columns:minmax(0,260px) minmax(0,1fr)}
.lim5 li span{font-size:15px}
.chips5{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
details.det5{border-top:1px solid var(--rule)}
details.det5:last-child{border-bottom:1px solid var(--rule)}
details.det5[open]{padding-bottom:24px}
#m-status,#m-scales,#m-ratings,#m-charts,#m-limits,#m-more{scroll-margin-top:72px}

/* ---------- responsive ---------- */
@media (max-width:980px){
  .doors5{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:900px){
  .hero5-g,.claim5,.two5{grid-template-columns:1fr}
  .snapshot5{grid-template-columns:1fr}
  .pills5{border-left:0;padding:16px 0 0;border-top:1px solid var(--rule);grid-template-columns:1fr 1fr;min-width:0}
  .grp5{grid-template-columns:1fr;gap:16px}
  .acc5-p dl{grid-template-columns:1fr}
  .doors5.three{grid-template-columns:1fr}
  .fut5p .split{grid-template-columns:1fr}
  .lim5 li{grid-template-columns:1fr}
}
@media (max-width:640px){
  .h1-5.xl{font-size:36px}
  .snapshot5 .sub5.big{font-size:18px}
  .snapshot5-l li{grid-template-columns:1fr;gap:3px;padding:13px 0}
  .chainlab5-h{display:none}
  .doors5{grid-template-columns:1fr}
  .door5{min-height:0}
  .acc5-b{grid-template-columns:minmax(0,1fr) 14px}
  .acc5-m{grid-column:1;grid-row:2;justify-content:flex-start}
  .acc5-b i{grid-column:2;grid-row:1/3}
  .pills5{grid-template-columns:1fr}
  .pn5 a b{font-size:16px}
}

details.more5{margin-top:28px;border-top:1px solid var(--rule)}
details.more5>summary{cursor:pointer;list-style:none;display:flex;align-items:center;gap:10px;padding:16px 0;font-size:15px;font-weight:650;color:var(--ink-2)}
details.more5>summary::-webkit-details-marker{display:none}
details.more5>summary::before{content:"+";display:inline-grid;place-items:center;width:20px;height:20px;border:1px solid var(--rule);border-radius:50%;font-size:14px;font-weight:500}
details[open].more5>summary::before{content:"−"}
details.more5>.accg5:first-of-type{margin-top:8px}

/* ---------- v5.1 fixes after review ---------- */
:root:not([data-theme="dark"]){--ink-3:#5b6976}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--ink-3:#8795a3}}
.sgd5:not(.q){box-shadow:0 0 0 1px color-mix(in srgb,var(--ink) 30%,transparent)}
.er5{grid-template-columns:minmax(0,1.1fr) 196px minmax(0,2fr) 18px}
@media (max-width:760px){.er5{grid-template-columns:minmax(0,1fr) auto 14px}}
.core5-b{font-size:clamp(26px,3vw,38px)}
.door5{min-height:0;padding-top:26px}
.door5 .tag5,.door5 .wip5{position:absolute;top:-11px;left:20px;background:var(--paper)}
.door5 .tag5{background:var(--hs-soft)}
.door5.pri b{color:var(--ink)}
.doors5{margin-top:12px}
.ic5,.in5{border-radius:8px}
.ic5-tr{font-size:13px;color:var(--ink-2)}
.ic5wrap.single .ic5-panel::before{display:none}
.ic5wrap.single .ic5-panel{border-top:1px solid var(--rule)}
.in5 header .cav5w{margin-left:auto}
.cav5.why5{min-width:20px;justify-content:center}
/* one disclosure pattern: label left, + on the right */
details.det5 summary::before,details.more5>summary::before{content:none}
details.det5 summary,details.more5>summary{justify-content:space-between}
details.det5 summary::after,details.more5>summary::after,details.ic5-more summary::after{content:"+";font-size:18px;font-weight:400;color:var(--ink-2);margin-left:16px}
details[open].det5 summary::after,details[open].more5>summary::after,details[open].ic5-more summary::after{content:"−"}
details.ic5-more summary{list-style:none;display:flex;justify-content:space-between;width:auto}
details.ic5-more summary::-webkit-details-marker{display:none}
/* phone header: brand row, then one scrolling row of sections */
@media (max-width:640px){
  .bar .wrap{gap:2px 12px;padding-block:6px 0}
  .nav{flex-wrap:nowrap;overflow-x:auto;width:100%;margin:0 -6px;padding-bottom:4px;scrollbar-width:none}
  .nav::-webkit-scrollbar{display:none}
  .nav a{white-space:nowrap;flex:0 0 auto}
}

/* ---------- v5.2: tour on the map, link tabs, matrix key ---------- */
.map5 .st5.here .ring5{stroke-width:6}
.map5 .st5.here .core5{opacity:1}
.map5 .st5.here .nm5{text-decoration:underline;text-underline-offset:3px}
.crumbs{margin-bottom:30px}
.hops5{list-style:none;margin:18px 0 0;padding:0;display:flex;flex-wrap:wrap;gap:8px 0;align-items:stretch}
.hops5 li{display:flex;align-items:center;gap:8px;font-size:13.5px;color:var(--ink-2);padding-right:28px;position:relative}
.hops5 li:not(:last-child)::after{content:"→";position:absolute;right:8px;color:var(--ink-3)}
.hops5-n{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;border:1.5px solid var(--ink-3);font-family:var(--f-mono);font-size:12px;color:var(--ink);flex:0 0 auto}
.hops5 li:last-child .hops5-n{border-style:dashed}

<header class="bar"><div class="wrap">

    <span>Gradual Disempowerment Observatory</span></a>

</div></header>
<main id="view" tabindex="-1"></main>
<footer class="ft"><div class="wrap"><span><b style="color:var(--ink)">Gradual Disempowerment Observatory</b> · Better Futures Project · Zhang Yue</span><span>Draft v0.7 · Source selection: 13 October 2026 · AI-assisted primary-source checks; human review pending · <a href="#library">Awaiting review</a> · <a href="#method">Method and sources</a></span></div></footer>
<script>
/* ---------- small chart kit: line, bars, columns, stack rows, dumbbell, spark ---------- */
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const ym=(y,m)=>y+(m-1)/12;                       // month start as decimal year
const fmtDate=x=>{const y=Math.floor(x+1e-6);const m=Math.min(11,Math.max(0,Math.floor((x-y)*12+0.01)));return MON[m]+' '+y};
const fmtQ=x=>{const y=Math.floor(x+1e-6);return 'Q'+(Math.min(3,Math.floor((x-y)*4))+1)+' '+y};
const fmtMin=v=>v<0.75?(Math.round(v*60)+' sec'):v<60?(Math.round(v)+' min'):v<600?((v/60).toFixed(1).replace(/\.0$/,'')+' h'):(Math.round(v/60)+' h');
const C={s1:'var(--s1)',s2:'var(--s2)',s3:'var(--s3)',ctx:'var(--ctx)',ink:'var(--ink)',p1:'var(--p1)',p2:'var(--p2)',p3:'var(--p3)'};

const Charts=(()=>{
  const mounted=new Set();let CAP=null;
  function capture(fn){CAP=[];try{fn()}catch(e){}const r=CAP;CAP=null;return r}
  function mount(el,draw){el.__draw=draw;mounted.add(el);draw()}
  function redraw(){mounted.forEach(el=>{if(!document.body.contains(el)){mounted.delete(el);return}el.__draw()})}
  let rt;window.addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(redraw,140)});
  const width=el=>Math.max(260,Math.floor(el.clientWidth||el.parentNode&&el.parentNode.clientWidth||600));

  function tipAt(el,tip,px,py,W){
    tip.style.display='block';
    const tw=tip.offsetWidth,th=tip.offsetHeight;
    let l=px+14; if(l+tw>W-2) l=px-tw-14; if(l<0) l=Math.max(0,Math.min(W-tw,px-tw/2));
    let t=py-th-10; if(t<0) t=py+14;
    tip.style.left=l+'px'; tip.style.top=t+'px';
  }
  function tableHTML(head,rows){
    return `<details class="tbl"><summary>Data table</summary><div class="sc"><table><thead><tr>${head.map(h=>`<th>${esc(h)}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map(c=>`<td>${c==null?'':esc(c)}</td>`).join('')}</tr>`).join('')}</tbody></table></div></details>`;
  }
  function legendHTML(items){
    if(items.length<2) return '';
    return `<div class="lg">${items.map(s=>`<span><i class="${s.kind||''}${s.dash?' dash':''}" style="${s.kind==='box'||s.kind==='dot'?'background':'border-color'}:${s.color}"></i>${esc(s.name)}</span>`).join('')}</div>`;
  }
  function axisHTML(x,y){
    return `<div class="axis-note"><span><b>X-axis</b> ${esc(x||'date or year')}</span><span><b>Y-axis</b> ${esc(y||'value')}</span></div>`;
  }

  /* ----- line chart ----- */
  function line(el,cfg){if(CAP){cfg.series.forEach(s=>{if(s.rec!==false)CAP.push(...s.pts.map(p=>p[0]))});return}mount(el,()=>drawLine(el,cfg))}
  function drawLine(el,cfg0){
    const W=width(el),narrow=W<520;
    const cfg=narrow&&(cfg0.x.minNarrow!=null||cfg0.series.some(s=>s.narrowHide))?{...cfg0,series:cfg0.series.filter(s=>!s.narrowHide).map(s=>cfg0.x.minNarrow!=null?{...s,pts:s.pts.filter(p=>p[0]>=cfg0.x.minNarrow)}:s)}:cfg0;
    const H=cfg.h||(narrow?250:310);
    const yf=cfg.y.fmt||(v=>v),ytf=cfg.y.tip||yf,xtf=cfg.x.tip||fmtDate,xf=cfg.x.fmt||(v=>v);
    const log=!!cfg.y.log,ty=v=>log?Math.log10(v):v;
    const yt=cfg.y.ticks,ymin=cfg.y.min??yt[0],ymax=cfg.y.max??yt[yt.length-1];
    const tickW=Math.max(...yt.map(v=>String(yf(v)).length))*6.7+12;
    const ends=cfg.series.filter(s=>s.end!==false&&s.pts.length);
    const endTxt=s=>narrow&&s.endLabelNarrow!=null?s.endLabelNarrow:s.endLabel!=null?s.endLabel:ytf(s.pts[s.pts.length-1][1]);
    const endW=ends.length?Math.max(...ends.map(s=>String(endTxt(s)).length))*7.4+16:16;
    const P={l:tickW,r:Math.min(endW,narrow?104:190),t:cfg.pt||14,b:26};
    const xmin=narrow&&cfg.x.minNarrow!=null?cfg.x.minNarrow:cfg.x.min,xmax=cfg.x.max;
    const sx=x=>P.l+(x-xmin)/(xmax-xmin)*(W-P.l-P.r);
    const sy=y=>P.t+(ty(ymax)-ty(y))/(ty(ymax)-ty(ymin))*(H-P.t-P.b);
    let g='';
    let bl='';(cfg.xbands||[]).forEach(b=>{g+=`<rect x="${sx(b.x0)}" y="${P.t}" width="${sx(b.x1)-sx(b.x0)}" height="${H-P.t-P.b}" fill="var(--surface-2)" opacity=".6"/>`;if(b.label)bl+=`<text x="${sx(b.x0)+6}" y="${P.t+(b.dy||13)}" class="ann">${esc(b.label)}</text>`});
    (cfg.hbands||[]).forEach(b=>{const y1=sy(Math.min(b.y1,ymax)),y0=sy(b.y0);g+=`<rect x="${P.l}" y="${y1}" width="${W-P.l-P.r}" height="${y0-y1}" fill="var(--surface-2)"/>`;if(b.label)bl+=`<text x="${P.l+6}" y="${y1+12}" class="ann">${esc(b.label)}</text>`});
    yt.forEach(v=>{const y=sy(v);g+=`<line x1="${P.l}" x2="${W-P.r}" y1="${y}" y2="${y}" stroke="var(--grid)"/><text x="${P.l-7}" y="${y+3.5}" text-anchor="end">${esc(yf(v))}</text>`});
    if(cfg.zero!=null&&cfg.zero>ymin&&cfg.zero<ymax)g+=`<line x1="${P.l}" x2="${W-P.r}" y1="${sy(cfg.zero)}" y2="${sy(cfg.zero)}" stroke="var(--ink-3)"/>`;
    const xts=(narrow&&cfg.x.ticksNarrow)||cfg.x.ticks;
    xts.forEach(v=>{g+=`<text x="${sx(v)}" y="${H-P.b+16}" text-anchor="middle">${esc(xf(v))}</text><line x1="${sx(v)}" x2="${sx(v)}" y1="${H-P.b}" y2="${H-P.b+4}" stroke="var(--rule)"/>`});
    g+=`<line x1="${P.l}" x2="${W-P.r}" y1="${H-P.b}" y2="${H-P.b}" stroke="var(--rule)"/>`;
    (cfg.vlines||[]).forEach(v=>{const x=sx(v.x);const a=v.anchor||(x>W*0.6?'end':'start');g+=`<line x1="${x}" x2="${x}" y1="${P.t}" y2="${H-P.b}" stroke="var(--ink-3)" stroke-dasharray="2 3"/><text x="${x+(a==='end'?-6:6)}" y="${P.t+(v.dy||11)}" text-anchor="${a}" class="ann">${esc(v.label)}</text>`});
    g+=bl;let m='';
    (cfg.ranges||[]).forEach(r=>{const x=sx(r.x);m+=`<line x1="${x}" x2="${x}" y1="${sy(r.lo)}" y2="${sy(r.hi)}" stroke="${r.color}" stroke-width="2" opacity=".55"/><line x1="${x-5}" x2="${x+5}" y1="${sy(r.lo)}" y2="${sy(r.lo)}" stroke="${r.color}" stroke-width="2" opacity=".55"/><line x1="${x-5}" x2="${x+5}" y1="${sy(r.hi)}" y2="${sy(r.hi)}" stroke="${r.color}" stroke-width="2" opacity=".55"/>`});
    cfg.series.forEach(s=>{
      const n=s.pts.length;if(!n)return;
      const pts=s.pts.map(p=>[sx(p[0]),sy(p[1])]);
      if(!s.dots){
        const cut=s.gapAfter;
        const seg=(a,b,dash)=>{const d=pts.slice(a,b+1).map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');return d.length>3?`<path d="${d}" fill="none" stroke="${s.color}" stroke-width="${s.w||2}" stroke-linejoin="round" stroke-linecap="round" ${dash?'stroke-dasharray="5 5"':''} ${s.op?`opacity="${s.op}"`:''}/>`:''};
        if(s.area){const d=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ')+` L${pts[n-1][0]} ${sy(Math.max(ymin,log?ymin:0))} L${pts[0][0]} ${sy(Math.max(ymin,log?ymin:0))}Z`;m+=`<path d="${d}" fill="${s.color}" opacity=".1"/>`}
        if(cut!=null){m+=seg(0,cut,s.dash)+`<path d="M${pts[cut][0]} ${pts[cut][1]} L${pts[cut+1][0]} ${pts[cut+1][1]}" fill="none" stroke="var(--ink-3)" stroke-width="1.3" stroke-dasharray="2 4"/>`+seg(cut+1,n-1,s.dash)}
        else m+=seg(0,n-1,s.dash);
      }
      const mk=s.markers||(n<=18?'all':'end');
      s.pts.forEach((p,i)=>{if(mk==='none'||p[3]==='n')return;if(mk==='end'&&i<n-1)return;const hollow=p[3]==='h';m+=`<circle cx="${pts[i][0].toFixed(1)}" cy="${pts[i][1].toFixed(1)}" r="${s.r||(i===n-1?4.5:3.5)}" fill="${hollow?'var(--surface)':s.color}" stroke="${hollow?s.color:'var(--surface)'}" stroke-width="2" ${s.op?`opacity="${s.op}"`:''}/>`});
    });
    const lab=cfg.series.filter(s=>s.labels);lab.forEach(s=>{s.pts.forEach((p,i)=>{if(s.end!==false&&i===s.pts.length-1)return;const below=lab.some(o=>o!==s&&o.pts.some(q=>Math.abs(q[0]-p[0])<1e-4&&q[1]>p[1]));m+=`<text x="${sx(p[0]).toFixed(1)}" y="${(sy(p[1])+(below?18:-9)).toFixed(1)}" text-anchor="middle" class="end" style="font-weight:550">${esc(ytf(p[1]))}</text>`})});
    // end labels with simple collision nudge
    const labs=ends.map(s=>{const p=s.pts[s.pts.length-1];return {y:sy(p[1]),x:sx(p[0]),t:endTxt(s),mu:s.endMuted}}).sort((a,b)=>a.y-b.y);
    for(let i=labs.length-1;i>0;i--){if(Math.abs(labs[i].y-labs[i-1].y)<2.5&&Math.abs(labs[i].x-labs[i-1].x)<2){const a=labs[i-1],b=labs[i],first=a.mu&&!b.mu?b:a,second=first===a?b:a;a.t=first.t+', '+second.t;a.mu=a.mu&&b.mu;labs.splice(i,1)}}
    for(let i=1;i<labs.length;i++){if(labs[i].y-labs[i-1].y<14)labs[i].y=labs[i-1].y+14}
    labs.forEach(l=>{m+=`<text x="${l.x+9}" y="${l.y+4}" class="end${l.mu?' mu':''}">${esc(l.t)}</text>`});
    ((narrow&&cfg.annNarrow)||cfg.ann||[]).forEach(a=>{const x=sx(a.x),y=sy(a.y),tx=x+(a.dx||0),ty2=y+(a.dy||0);if(a.lead)m+=`<line x1="${x}" y1="${y}" x2="${tx+(a.anchor==='end'?4:-4)}" y2="${ty2-4}" stroke="var(--ink-3)"/>`;const lines=String(a.text).split('\n');m+=`<text x="${tx}" y="${ty2}" text-anchor="${a.anchor||'start'}" class="ann${a.strong?' strong':''}">${lines.map((t,i)=>`<tspan x="${tx}" dy="${i?14:0}">${esc(t)}</tspan>`).join('')}</text>`});
    const lgs=cfg.series.filter(s=>s.name&&s.legend!==false);if(cfg.legendReverse)lgs.reverse();const lg=cfg.legend===false?'':legendHTML(lgs.map(s=>({name:s.name,color:s.color,dash:s.dash,kind:s.dots?'dot':''})));
    // table
    const xs=[...new Set(cfg.series.filter(s=>s.tip!==false).flatMap(s=>s.pts.map(p=>+p[0].toFixed(4))))].sort((a,b)=>a-b);
    const named=cfg.series.filter(s=>s.name&&s.tip!==false);
    const tbl=tableHTML([cfg.x.label||'Date',...named.map(s=>s.name)],xs.map(x=>[xtf(x),...named.map(s=>{const p=s.pts.find(p=>Math.abs(p[0]-x)<1e-4);return p?ytf(p[1])+(p[2]?' ('+p[2]+')':''):null})]));
    el.innerHTML=`${lg}${axisHTML(cfg.x.label||'date or year',cfg.y.label||cfg.valLabel||'value')}<div style="position:relative"><svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" tabindex="0" aria-label="${esc(cfg.aria||'Line chart')}">${g}${m}<line class="xh" y1="${P.t}" y2="${H-P.b}" stroke="var(--ink)" stroke-width="1" style="display:none"/><rect x="${P.l}" y="${P.t}" width="${W-P.l-P.r}" height="${H-P.t-P.b}" fill="transparent" class="hit"/></svg><div class="tip"></div></div>${cfg.table===false?'':tbl}`;
    const svg=el.querySelector('svg'),tip=el.querySelector('.tip'),xh=el.querySelector('.xh');
    let idx=-1;
    const show=i=>{
      if(i<0||i>=xs.length){tip.style.display='none';xh.style.display='none';return}
      idx=i;const x=xs[i],px=sx(x);
      xh.setAttribute('x1',px);xh.setAttribute('x2',px);xh.style.display='';
      const near=named.map(s=>({s,p:s.pts.find(p=>Math.abs(p[0]-x)<1e-4)})).filter(o=>o.p);
      tip.innerHTML='';const d=document.createElement('div');d.className='d';d.textContent=xtf(x);tip.appendChild(d);
      near.forEach(o=>{const r=document.createElement('div');r.className='r';const k=document.createElement('i');k.style.background=o.s.color;const b=document.createElement('b');b.textContent=ytf(o.p[1]);const sp=document.createElement('span');sp.textContent=o.s.name;r.append(k,b,sp);tip.appendChild(r);if(o.p[2]){const nt=document.createElement('div');nt.className='nt';nt.textContent=o.p[2];tip.appendChild(nt)}});
      tipAt(el,tip,px,Math.min(...near.map(o=>sy(o.p[1]))),W);
    };
    const move=e=>{const r=svg.getBoundingClientRect();const mx=(e.clientX-r.left);let best=-1,bd=1e9;xs.forEach((x,i)=>{const d=Math.abs(sx(x)-mx);if(d<bd){bd=d;best=i}});show(best)};
    svg.addEventListener('pointermove',move);svg.addEventListener('pointerdown',move);
    svg.addEventListener('pointerleave',()=>show(-1));
    svg.addEventListener('keydown',e=>{if(e.key==='ArrowRight'){show(Math.min(xs.length-1,idx+1));e.preventDefault()}else if(e.key==='ArrowLeft'){show(Math.max(0,idx<0?xs.length-1:idx-1));e.preventDefault()}else if(e.key==='Escape')show(-1)});
    svg.addEventListener('blur',()=>show(-1));
  }

  /* ----- horizontal bars (label above bar), supports diverging ----- */
  function bars(el,cfg){if(CAP)return;mount(el,()=>drawBars(el,cfg))}
  function drawBars(el,cfg){
    const W=width(el),rh=cfg.rh||46,P={l:2,r:64,t:6,b:cfg.axis===false?6:24};
    const rows=cfg.rows,fmt=cfg.fmt||(v=>v),data=rows.filter(r=>!r.head);
    const min=cfg.min??Math.min(0,...data.map(r=>r.value)),max=cfg.max??Math.max(0,...data.map(r=>r.value));
    const neg=min<0;if(neg)P.l=58;
    const sx=v=>P.l+(v-min)/(max-min)*(W-P.l-P.r),x0=sx(0);
    let m='',y=P.t;const ys=[];
    rows.forEach((r,i)=>{
      if(r.head){if(i)y+=8;m+=`<text x="2" y="${y+12}" style="letter-spacing:.06em">${esc(r.head.toUpperCase())}</text><line x1="0" x2="${W}" y1="${y+18}" y2="${y+18}" stroke="var(--rule)"/>`;y+=24;return}
      const bh=Math.min(16,rh-26),by=y+22,x1=sx(r.value),xa=r.from!=null?sx(r.from):x0,bx=Math.min(xa,x1),bw=Math.max(1.5,Math.abs(x1-xa));ys.push(by);
      const rr=Math.min(4,bw/2),right=r.value>=0;
      const d=r.from!=null?`M${bx} ${by}h${bw}v${bh}h-${bw}z`:right?`M${bx} ${by}h${bw-rr}a${rr} ${rr} 0 0 1 ${rr} ${rr}v${bh-2*rr}a${rr} ${rr} 0 0 1 -${rr} ${rr}h-${bw-rr}z`:`M${bx+bw} ${by}h-${bw-rr}a${rr} ${rr} 0 0 0 -${rr} ${rr}v${bh-2*rr}a${rr} ${rr} 0 0 0 ${rr} ${rr}h${bw-rr}z`;
      m+=`<g class="row" data-i="${i}"><text x="${P.l}" y="${y+15}" class="cat">${esc(r.label)}</text><path d="${d}" fill="${r.hollow?'var(--surface)':(r.color||C.s1)}" ${r.hollow?`stroke="${r.color||C.s1}" stroke-width="1.5" stroke-dasharray="3 3"`:''}/><text x="${right?x1+7:x1-7}" y="${by+bh/2+4}" text-anchor="${right?'start':'end'}" class="end">${esc(r.vlabel||fmt(r.value))}</text><rect x="0" y="${y}" width="${W}" height="${rh}" fill="transparent"/></g>`;
      if(neg)m+=`<line x1="${x0}" x2="${x0}" y1="${by-4}" y2="${by+bh+4}" stroke="var(--ink-2)"/>`;
      y+=rh});
    const H=y+P.b;let g='';
    (cfg.ticks||[]).forEach(v=>{g+=`<line x1="${sx(v)}" x2="${sx(v)}" y1="${P.t}" y2="${H-P.b}" stroke="var(--grid)"/><text x="${sx(v)}" y="${H-P.b+15}" text-anchor="middle">${esc(fmt(v))}</text>`});
    const tbl=tableHTML([cfg.catLabel||'',cfg.valLabel||'Value',...(data.some(r=>r.note)?['Note']:[])],data.map(r=>[r.label,r.vlabel||fmt(r.value),...(data.some(q=>q.note)?[r.note||'']:[])]));
    el.innerHTML=`${axisHTML(cfg.catLabel||'category',cfg.valLabel||'value')}<div style="position:relative"><svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(cfg.aria||'Bar chart')}">${g}${m}</svg><div class="tip"></div></div>${cfg.table===false?'':tbl}`;
    const tip=el.querySelector('.tip'),svg=el.querySelector('svg');
    el.querySelectorAll('.row').forEach(n=>{const r=rows[+n.dataset.i];n.addEventListener('pointermove',e=>{const b=svg.getBoundingClientRect();tip.innerHTML='';const d=document.createElement('div');d.className='r';const bb=document.createElement('b');bb.textContent=r.vlabel||fmt(r.value);const sp=document.createElement('span');sp.textContent=r.label;d.append(bb,sp);tip.appendChild(d);if(r.note){const nt=document.createElement('div');nt.className='nt';nt.textContent=r.note;tip.appendChild(nt)}tipAt(el,tip,e.clientX-b.left,e.clientY-b.top,W)});n.addEventListener('pointerleave',()=>tip.style.display='none')});
  }

  /* ----- columns over time ----- */
  function cols(el,cfg){if(CAP){(cfg.sets||[{pts:cfg.pts}]).forEach(s=>CAP.push(...s.pts.filter(p=>p[1]!=null).map(p=>p[0])));return}mount(el,()=>drawCols(el,cfg))}
  function drawCols(el,cfg){
    const W=width(el),narrow=W<520,H=cfg.h||(narrow?230:280);
    const yf=cfg.y.fmt||(v=>v),ytf=cfg.y.tip||yf,xtf=cfg.x.tip||fmtDate,xf=cfg.x.fmt||(v=>v);
    const yt=cfg.y.ticks,ymax=cfg.y.max??yt[yt.length-1];
    const P={l:Math.max(...yt.map(v=>String(yf(v)).length))*6.7+12,r:12,t:cfg.pt||14,b:26};
    const xmin=cfg.x.min,xmax=cfg.x.max,sx=x=>P.l+(x-xmin)/(xmax-xmin)*(W-P.l-P.r),sy=y=>P.t+(ymax-y)/ymax*(H-P.t-P.b);
    const sets=cfg.sets||[{name:cfg.name,color:cfg.color||C.s1,pts:cfg.pts}];

  /* ----- stacked rows (shares summing to 100) ----- */

  /* ----- sparkline thumbnail ----- */
  function spark(el,cfg){if(CAP)return;mount(el,()=>{

  /* ----- measurement record: one row per link, one lane per indicator, one tick per observation ----- */
  const sigSVG=(x,y,l)=>[0,1,2,3].map(k=>`<rect x="${x+k*6}" y="${y-(5+k*3)}" width="4" height="${5+k*3}" rx="1" fill="${l===0?'none':(k<l?'var(--ink)':'var(--rule)')}" ${l===0?'stroke="var(--ink-3)" stroke-width=".8" stroke-dasharray="1.5 1.5"':''}/>`).join('');
  function record(el,cfg){mount(el,()=>drawRecord(el,cfg))}
  function drawRecord(el,cfg){
    const W=width(el),narrow=W<780,LW=narrow?0:196,RW=narrow?0:204,P={l:LW+6,r:RW+8,t:44,b:28};

    const lh=narrow?11:14,th=narrow?7:9,pad=narrow?8:10,head=narrow?24:0,minL=narrow?2:3;
    let y=P.t,g='',m='',hit='';const lanes=[];
    cfg.rows.forEach((r,ri)=>{
      const nd=r.lanes.filter(l=>l.kind==='d').length,np=r.lanes.length-nd,slots=r.lanes.length+(nd?0:1);
      const h=head+pad*2+Math.max(slots,minL)*lh;

      const cnt=nd+' direct'+(np?' · '+np+' nearby':'');
      if(narrow){g+=`<text x="2" y="${y+17}" class="cat halo" style="font-weight:650">${esc(r.name)}</text><text x="${W-2}" y="${y+17}" text-anchor="end" class="halo" style="font-size:10.5px">${esc(cnt)}</text>`}
      else{g+=`<text x="2" y="${y+pad+10}" style="font-size:11px">${String(ri+1).padStart(2,'0')}</text><text x="28" y="${y+pad+11}" class="cat" style="font-weight:650;font-size:14px">${esc(r.name)}</text>${sigSVG(28,y+pad+31,r.level)}<text x="58" y="${y+pad+30}" style="font-family:var(--f-display);font-size:11.5px;fill:var(--ink-2)">${esc(r.word)}</text><text x="28" y="${y+pad+47}" style="font-size:10.5px">${esc(cnt)} series</text>`}
      const off=(Math.max(slots,minL)-slots)*lh/2;let li=0;
      if(!nd){const ly=y+head+pad+off;m+=`<rect x="${P.l}" y="${ly+1.5}" width="${W-P.l-P.r}" height="${lh-3}" fill="url(#rechatch)" stroke="var(--rule)" stroke-width=".8"/>`;
        if(narrow)m+=`<text x="${(P.l+W-P.r)/2}" y="${ly+lh-3}" text-anchor="middle" class="halo" style="font-size:9.5px;letter-spacing:.1em;fill:var(--ink)">NO DIRECT READING</text>`;
        else m+=`<text x="${W-P.r+10}" y="${ly+lh-3.5}" style="font-size:10.5px;fill:var(--ink);font-weight:600">no direct reading found</text>`;li=1}
      r.lanes.forEach(l=>{const ly=y+head+pad+off+li*lh;li++;const i=lanes.length;lanes.push({r,l,y:ly});const col=l.kind==='d'?'var(--s1)':'var(--ctx)';
        hit+=`<rect class="lane" data-i="${i}" x="${P.l}" y="${ly}" width="${W-P.l-(narrow?P.r:8)}" height="${lh}" fill="transparent"/>`;
        m+=`<g>`+(l.bar?`<rect x="${sx(l.xs[0]).toFixed(1)}" y="${(ly+lh/2-1.75).toFixed(1)}" width="${(sx(l.xs[l.xs.length-1])-sx(l.xs[0])).toFixed(1)}" height="3.5" rx="1.75" fill="${col}"/>`
          :l.xs.map(x=>`<rect x="${(sx(x)-1.3).toFixed(1)}" y="${(ly+(lh-th)/2).toFixed(1)}" width="2.6" height="${th}" rx=".6" fill="${col}"/>`).join(''))+`</g>`;
        if(!narrow)m+=`<text x="${W-P.r+10}" y="${ly+lh-3.5}" style="font-size:10.5px;fill:${l.kind==='d'?'var(--ink)':'var(--ink-2)'}">${esc(l.name)}</text>`});
      y+=h});
    g+=`<line x1="0" x2="${W}" y1="${y}" y2="${y}" stroke="var(--ink)"/>`;
    const H=y+P.b;let ax='';
    cfg.x.ticks.forEach(v=>{ax+=`<line x1="${sx(v)}" x2="${sx(v)}" y1="${P.t}" y2="${y}" stroke="var(--grid)"/><text x="${sx(v)+3}" y="${P.t-8}">${v}</text><text x="${sx(v)+3}" y="${y+16}">${v}</text>`});
    (cfg.vlines||[]).forEach(v=>{ax+=`<line x1="${sx(v.x)}" x2="${sx(v.x)}" y1="4" y2="${y}" stroke="var(--ink-3)" stroke-dasharray="2 3"/><text x="${sx(v.x)-6}" y="13" text-anchor="end" class="ann">${esc(v.label)}</text>`});
    if(!narrow)ax+=`<text x="${W-P.r+10}" y="${P.t-8}">SERIES</text>`;
    const defs=`<defs><pattern id="rechatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="7" stroke="var(--ink)" stroke-opacity=".28" stroke-width="1.1"/></pattern></defs>`;
    const tbl=tableHTML(['Link','Series','Kind','Readings shown','First','Last'],lanes.map(o=>[o.r.name,o.l.full||o.l.name,o.l.kind==='d'?'direct':'nearby',o.l.xs.length,fmtDate(o.l.xs[0]),fmtDate(o.l.xs[o.l.xs.length-1])]));
    const sw=(c,w,h,r)=>`<i class="box" style="background:${c};width:${w}px;height:${h}px;border-radius:${r}px"></i>`;
    el.innerHTML=`<div class="lg"><span>${sw('var(--s1)',3,11,0)}${esc(cfg.names[0])}</span><span>${sw('var(--ctx)',3,11,0)}${esc(cfg.names[1])}</span><span>${sw('var(--s1)',16,3.5,2)}${sw('var(--ctx)',16,3.5,2)}${esc(cfg.names[2])}</span><span><i class="box hat" style="width:22px;height:9px;border-radius:0"></i>${esc(cfg.names[3])}</span></div>${axisHTML('date of reading','step and source series')}<div style="position:relative;margin-top:10px"><svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(cfg.aria||'')}">${defs}${ax}${g}<rect class="lanehl" x="${P.l}" width="${W-P.l-(narrow?P.r:8)}" height="${lh}" y="0" fill="var(--surface-2)" visibility="hidden"/>${m}${hit}</svg><div class="tip"></div></div>${tbl}`;
    const svg=el.querySelector('svg'),tip=el.querySelector('.tip'),hl=el.querySelector('.lanehl');
    el.querySelectorAll('.lane').forEach(n=>{const o=lanes[+n.dataset.i];n.style.cursor='pointer';
      n.addEventListener('pointermove',e=>{const b=svg.getBoundingClientRect();hl.setAttribute('y',o.y);hl.setAttribute('visibility','visible');tip.innerHTML='';

        const t=document.createElement('div');t.className='r';t.style.whiteSpace='normal';const bb=document.createElement('b');bb.textContent=o.l.full||o.l.name;t.appendChild(bb);

        tip.append(d,t,c);tipAt(el,tip,Math.min(e.clientX-b.left,W-P.r),o.y+10,W)});
      n.addEventListener('pointerleave',()=>{tip.style.display='none';hl.setAttribute('visibility','hidden')});
      n.addEventListener('click',()=>cfg.onPick&&cfg.onPick(o.r,o.l))});
  }

  return {line,bars,cols,stack,dumbbell,spark,record,capture,redraw};
})();

  {id:'students',tab:['UK undergraduates using AI for assessed work','94%','HEPI · 2026 survey'],tag:'primary',rec:'d',recName:'Students: HEPI, Pew',

 sceptic:['<b>Wide but shallow.</b> Generative AI assisted 6.3% of US work hours in the second quarter of 2026, and fewer than 3% of job tasks have adoption above 50%. In the euro area, 70% of firms report some AI use but only 7% call it significant (ECB 2026).',
  '<b>No pay effect yet.</b> In Danish administrative records, workers who adopted chatbots saw no change in earnings or hours. The study (Humlum and Vestergaard, Still Waters, Rapid Currents, NBER w33777, 2026) rules out effects above 2%.',
  '<b>Recent growth has slowed.</b> Gallup\'s any-use figure rose 1 point in the third quarter of 2026; the ONS calls UK firm use "broadly stable" from June to September 2026; Census firm use stayed at 17 to 20% for five months; and Ramp says adoption is "decelerating".',
  '<b>Definitions swing the number.</b> Estimates run from 18% of firms to firms covering 78% of employment.'],

{id:'handover',n:3,name:'Delegation to AI',line:'trunk',level:3,
 levelWhy:"Repeated, but from the companies' own logs",
 dir:'Coding rising; chat flat within method noise',asof:'Nov 2025',
 headline:'45% of chats hand the task over',
 status:'Peaked at 49%, eased to 45%',
 claim:'On Claude, people hand the task over to the AI in just under half of conversations. The share rose, peaked and eased back, all within the noise of the method. In coding, agent use keeps rising.',
 deck:'Anthropic classifies each Claude conversation as automation, where the user hands the task over, or augmentation, where the user works through it with the model. Automation went from 41% in January 2025 to 49% in August, then back to 45% in November. Where businesses connect their own software to Claude, it was about three-quarters in November 2025; the March 2026 report says augmentation then "increased slightly" in business traffic too, and that automation "decreased sharply" in business API data, giving no figure in the text. Engineers also leave AI coding agents to run for longer between checks, and the share of developers using AI agents at work rose from 31% to 59% in a year.',
 tour:'Help turns into hand-over. In 45% of Claude conversations the user hands the task over. The share peaked at 49% and eased.',
 inds:[
  {id:'aei',tab:['Conversations that hand the task over','45%','Claude.ai · Nov 2025'],tag:'direct',rec:'d',recName:'Claude.ai: tasks handed over',
   title:'Automation rose to 49% of conversations in August 2025, then eased to 45%',
   sub:'Share of sampled Claude.ai conversations classified as automation or augmentation.',
   render(el){Charts.line(mk(el),{legendReverse:true,aria:'Anthropic Economic Index: automation 41, 49, 45 percent; augmentation 56, 47, 52 percent across three samples',
     x:{min:2024.85,max:2026.75,ticks:[2025,2025.5,2026,2026.5],ticksNarrow:[2025,2026],fmt:v=>v%1?'Jul '+Math.floor(v):'Jan '+v},y:{min:30,max:70,ticks:[30,40,50,60,70],fmt:pct,tip:v=>v+'%'},
     series:[{name:'Augmentation: working through it with the model',color:C.s2,labels:'above',pts:[[ym(2025,1),56,'restated by Anthropic; first published as 57%'],[ym(2025,8.2),47,'implied by the Jan 2026 report'],[ym(2025,11.5),52]]},
      {name:'Automation: handing the task over',color:C.s1,w:2.5,labels:'below',pts:[[ym(2025,1),41,'restated by Anthropic; first published as 43%'],[ym(2025,8.2),49,'implied by the Jan 2026 report'],[ym(2025,11.5),45]]}],
     vlines:[{x:ym(2026,2.3),label:'Feb 2026 report: no figures',anchor:'end'},{x:ym(2026,6.85),label:'Jun 2026 report: no figures in text',anchor:'end',dy:25}]});
     pairs(el,[{v:'77%',l:'of business use through the API (software calling Claude directly) was classed as automation',w:'AUG 2025'},{v:'about 75%',l:'of business use through the API was classed as automation',w:'NOV 2025'}])},
   read:'Each sample is one week of roughly a million conversations, classified by Anthropic\'s own model. Re-running the August 2025 sample with Anthropic\'s older classifier gave 45%, not 49%, so moves of a few points may reflect method, not behaviour. Product changes between samples shift who is using what. Business traffic is programmatic by nature, so its level says little about a trend. The June 2026 report gives no split in its text; it released monthly data for April and May 2026, now including Cowork, which have not been read for this draft.',
   src:[['Anthropic Economic Index, January 2026 report','https://www.anthropic.com/research/anthropic-economic-index-january-2026-report'],['Anthropic Economic Index, September 2025 report','https://www.anthropic.com/research/anthropic-economic-index-september-2025-report'],['Anthropic Economic Index, March 2026 report','https://www.anthropic.com/research/economic-index-march-2026-report']]},
  {id:'agents',tab:['AI actions in a row without human input','9.8 → 21.2','Anthropic engineers · Feb → Aug 2025'],tag:'company',rec:'d',recName:'Coding agents: autonomy',obs:[ym(2025,2),ym(2025,8),ym(2025,10),ym(2025,12),ym(2026,1)],

   src:[['Anthropic, Measuring AI agent autonomy in practice (Feb 2026)','https://www.anthropic.com/research/measuring-agent-autonomy'],['Anthropic, How AI is transforming work at Anthropic (Dec 2025)','https://www.anthropic.com/research/how-ai-is-transforming-work-at-anthropic']]},
