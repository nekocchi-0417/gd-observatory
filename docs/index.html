{id:'skills',n:6,name:'Skills and judgement',line:'people',level:1,
 levelWhy:'One-off studies; nothing tracked over time',
 dir:'Unknown: snapshots point both ways',asof:'Oct 2026',
 headline:'No repeated measurement',
 status:'4 of 233 studies re-test people over time',
 mech:'skills go unpractised',
 claim:'Use is surveyed every quarter. Whether people can still do the work unaided has never been tracked over time.',
 deck:'Of 233 empirical studies of generative AI found by the observatory\'s landscape review, 21 test people without AI and 22 follow the same people for months or longer; only 4 do both, all narrow. Careful experiments suggest that how AI is used decides whether people learn, that people follow wrong AI advice, and that they misjudge how much it helps them. Each is a single snapshot. No panel re-tests the same people without AI, so there is no trend to show. The clinical study compares one period before AI with one after, and the long-running literacy and numeracy tests (PIAAC, NAEP) cannot be tied to AI.',
 tour:'The worry is that skills go unpractised. Short trials point to lost learning; a three-year clinic audit found none. No general panel tracks it over time.',
 inds:[
  {id:'lopsided',tab:['Studies that re-test people without AI over months','4 of 233','landscape review · Oct 2026'],tag:'derived',rec:'d',recName:'Consultants; engineers',obs:[ym(2023,9),ym(2025,9),ym(2026,1)],wide:true,
   title:'AI use is surveyed again and again; of 233 studies of generative AI, only 4 re-test people without AI over months',
   sub:'Three repeated surveys of AI use, set beside the studies of what AI use does to ability.',
   render(el){const s=mk(el,'split');const a=document.createElement('div');a.innerHTML='<div class="panel-h">Use of AI: surveyed repeatedly</div>';s.appendChild(a);
     Charts.line(mk(a),{aria:'Three rising survey lines of AI use: US employees, UK undergraduates, US teens',h:270,table:false,
      x:{min:2023.2,max:2026.8,ticks:[2024,2025,2026]},y:{min:0,max:100,ticks:[0,25,50,75,100],fmt:pct,tip:v=>v+'%'},
      series:[{name:'UK undergraduates, for assessed work',color:C.s2,pts:[[2024.1,53],[2025.1,88],[2026.1,94]]},{name:'US employees, at work',color:C.s1,pts:gS('any')},{name:'US teens, ChatGPT for schoolwork',color:C.s3,pts:[[ym(2023,10),13],[ym(2024,10),26]]}]});
     const b=document.createElement('div');b.innerHTML=`<div class="panel-h">Ability without AI: what the studies found</div><ul class="studies">
      <li><span class="d">2021–22, PUBLISHED 2025 · POLAND · 19 ENDOSCOPISTS · OBSERVATIONAL</span>Detection rate without AI fell from 28.4% to 22.4% after months of working with it.</li>
      <li><span class="d">2021–23, PUBLISHED 2025 · JAPAN · ONE CENTRE · 4,712 MATCHED PROCEDURES · OBSERVATIONAL</span>Detection rate without AI held up over three years of using it.</li>
      <li><span class="d">AUTUMN 2023 · ~1,000 SCHOOL STUDENTS · RANDOMISED</span>17% lower exam score, without AI, after practising maths with ChatGPT.</li>
      <li><span class="d">JAN 2026 · 52 ENGINEERS · RANDOMISED</span>Scored 50% on a quiz, without AI, after learning with it, against 67% for those who learned without.</li></ul>
      `;s.appendChild(b);
     pairs(el,[{v:'21 of 233',l:'empirical studies of generative AI test people without AI',w:'OBSERVATORY LANDSCAPE REVIEW · OCT 2026'},{v:'22 of 233',l:'follow the same people for months or longer',w:'OBSERVATORY LANDSCAPE REVIEW · OCT 2026'},{v:'4',l:'do both; all narrow, and the longest runs about 4 months',w:'OBSERVATORY LANDSCAPE REVIEW · OCT 2026'}])},
   read:'The counts come from the observatory\'s own landscape review (October 2026), a broad sweep rather than a systematic review; its searches hit a limit, so "found" means found in that search. They include a 4-month writing study, two rounds of a developer trial and call-centre agents during AI outages; none re-tests a general population. Most studies are a different group, studied once over minutes to a few months. Two clinic audits tracked doctors over time and disagree: one found a fall, a three-year audit found none. In one call centre, workers kept their gains during AI outages. The survey lines cover different populations, so compare their slopes, not their levels. Trials of performance with AI (consultants, developers) have their own cards.',
   src:[['Gallup (2026)','https://www.gallup.com/workplace/712736/organizational-adoption-jumps-six-points.aspx'],['HEPI Student Generative AI Survey 2026','https://www.hepi.ac.uk/reports/student-generative-ai-survey-2026/'],['Dell\'Acqua et al., Navigating the Jagged Technological Frontier (2023)','https://papers.ssrn.com/sol3/papers.cfm?abstract_id=4573321'],['Okumura et al., Endoscopy (2025): no deskilling over three years','https://thieme-connect.com/products/all/doi/10.1055/a-2661-2624'],['Brynjolfsson, Li & Raymond, Generative AI at Work (QJE 2025)','https://arxiv.org/abs/2304.11771'],['Shen & Tamkin, How AI Impacts Skill Formation (Anthropic, Jan 2026)','https://www.anthropic.com/research/AI-assistance-coding-skills'],['Gradual Disempowerment Observatory, landscape review 3.0 (Oct 2026)','https://github.com/nekocchi-0417/gd-observatory/blob/main/research/landscape/review-3.0.md']]},
  {id:'bastani',tab:['Exam score after practising with ChatGPT','−17%','PNAS 2025 · ~1,000 pupils'],tag:'primary',rec:'d',recName:'Learning-with-AI trials',obs:[ym(2023,10),2025.1,ym(2026,1)],
   title:'How AI is used decides whether people learn',
   sub:'Score relative to students who practised without AI, in a randomised trial of high-school maths; then two further studies of learning with AI, tested without it.',
   render(el){Charts.bars(mk(el),{aria:'Practice scores up 48% and 127% with AI; later exam scores down 17% with plain ChatGPT and unchanged with a tutor-style version',min:-40,max:140,ticks:[-25,0,25,50,75,100,125],fmt:v=>(v>0?'+':'')+v+'%',catLabel:'Condition',valLabel:'Score vs no-AI group',
     rows:[{head:'While practising, with AI'},{label:'Plain ChatGPT',value:48,color:C.s2},{label:'Tutor-style ChatGPT (hints, not answers)',value:127,color:C.s2},{head:'Later exam, without AI'},{label:'Students who had plain ChatGPT',value:-17,color:C.s1},{label:'Students who had the tutor version',value:0,vlabel:'about 0',color:C.s1,note:'not statistically significant'}]});
     pairs(el,[{v:'−17%',l:'closed-book exam score after practising maths with a plain chatbot; a tutor-style version did no harm',w:'BASTANI ET AL. · PNAS 2025'},
      {v:'50% vs 67%',l:'quiz score without AI: engineers who learned a coding library with AI, against those who learned without',w:'SHEN & TAMKIN · 2026'},
      {v:'better',l:'later writing without AI, after practising cover letters with AI',w:'LIRA ET AL. · 2025'}])},
   read:'The Bastani trial covered one Turkish high school, four 90-minute sessions, autumn 2023. The harm disappeared when the chatbot was built to give hints instead of answers. Shen and Tamkin\'s 52 engineers did worst when they handed the work over and best when they asked conceptual questions. Lira and co-authors found practising with AI improved later unaided writing. Together they suggest answer-giving AI can harm learning while tutor-style or explaining designs do not. Each is a single study, and long-term learning was not tested. An upbeat meta-analysis of ChatGPT and learning (Wang and Fan) was retracted in April 2026.',
   src:[['Bastani et al., Generative AI without guardrails can harm learning (PNAS, 2025)','https://www.pnas.org/doi/10.1073/pnas.2422633122'],['Shen & Tamkin, How AI impacts skill formation (arXiv 2601.20245, 2026)','https://arxiv.org/abs/2601.20245'],['Lira et al., practising with AI and later unaided writing (arXiv 2502.02880, 2025)','https://arxiv.org/abs/2502.02880'],['Wang & Fan, ChatGPT and learning: meta-analysis, retracted 2026 (Humanities and Social Sciences Communications)','https://www.nature.com/articles/s41599-026-07310-z']]},
  {id:'metrrct',tab:['Developers using AI: measured speed','19% slower','believed 20% faster · METR'],tag:'primary',rec:'d',recName:'Developer trial, re-run',obs:[ym(2025,4),ym(2025,10)],
   title:'Developers thought AI made them faster. The stopwatch said slower.',
   sub:'Change in time taken to finish real coding tasks when AI tools were allowed, in a randomised trial; then two other studies of felt against actual ability.',
   render(el){Charts.bars(mk(el),{aria:'Developers expected to be 24% faster, believed they were 20% faster, and were measured 19% slower',min:-35,max:35,ticks:[-30,-15,0,15,30],fmt:v=>(v>0?'+':'')+v+'%',catLabel:'',valLabel:'Change in time taken',
     rows:[{label:'What developers forecast beforehand',value:-24,vlabel:'24% less time',color:C.s3},{label:'What they believed afterwards',value:-20,vlabel:'20% less time',color:C.s3},{label:'What was measured',value:19,vlabel:'19% more time',color:C.s1}]});
     pairs(el,[{v:'about 4 points',l:'by which people using ChatGPT overestimated their own LSAT reasoning score (out of 20); ChatGPT raised their actual score by about 3.5',w:'FERNANDES ET AL. · COMPUTERS IN HUMAN BEHAVIOR · 2025'},
      {v:'less secure',l:'code written with an AI assistant, which its writers were more likely to believe was secure',w:'PERRY ET AL. · ACM CCS · 2023'}])},
   read:'Sixteen experienced open-source developers, 246 tasks, early-2025 tools, on codebases they knew well. METR\'s 2026 follow-up could not produce a clean estimate because 30 to 50% of developers avoided tasks they would have had to do without AI. As read from METR\'s post, its point estimates were 18% faster for returning developers and 4% faster for new ones, both with intervals spanning zero; METR calls them very weak evidence. That reluctance is the closest existing evidence that people do not want to go back to working without AI. It is not a measure of lost ability.',
   src:[['METR, Measuring the impact of early-2025 AI on experienced open-source developer productivity','https://metr.org/blog/2025-07-10-early-2025-ai-experienced-os-dev-study/'],['METR, We are changing our developer productivity experiment design (Feb 2026)','https://metr.org/blog/2026-02-24-uplift-update/'],['Fernandes et al., performance and self-assessment with ChatGPT (Computers in Human Behavior, 2025)','https://doi.org/10.1016/j.chb.2025.108779'],['Perry et al., Do users write more insecure code with AI assistants? (arXiv 2211.03622)','https://arxiv.org/abs/2211.03622']]},
  {id:'wrongadvice',tab:['Accuracy when the AI was wrong','about 80% → under 20%','inexperienced mammography readers · 2023'],tag:'primary',rec:'d',recName:'Following wrong AI advice',obs:[2023.5,2024.8,ym(2025,8.7),2026.1],
   title:'People follow AI advice even when it is wrong',
   sub:'Studies that planted wrong AI advice, or compared people using AI with the AI working alone. Each is a single study.',
   render(el){pairs(el,[
     {from:'about 80%',v:'under 20%',l:'accuracy of inexperienced mammography readers when the AI\'s suggestion was wrong',w:'DRATSCH ET AL. · RADIOLOGY · 2023'},
     {v:'−14 points',l:'physicians\' diagnostic reasoning scores with deliberately wrong ChatGPT-4o suggestions',w:'QAZI ET AL. · MEDRXIV PREPRINT · 2025'},
     {from:'94.9%',v:'under 34.5%',l:'right condition found: the AI model alone, against members of the public using it',w:'BEAN ET AL. · NATURE MEDICINE · 2026'},
     {v:'g = −0.23',l:'human and AI working together did worse than the better of the two alone, across 106 experiments (g is a standard effect size; this is a small loss)',w:'VACCARO ET AL. · NATURE HUMAN BEHAVIOUR · 2024'}])},
   read:'Each study measures one moment; none follows the same people over time. The Qazi study is a preprint, not yet peer reviewed, and the mammography figure was not re-read at source for this draft. The pattern is not one-way: in other studies radiologists gave AI advice too little weight, and pairs did better when the person was better than the AI. Cues about how reliable the AI is can reduce over-reliance.',
   src:[['Dratsch et al., Automation bias in mammography (Radiology, 2023)','https://doi.org/10.1148/radiol.222176'],['Qazi et al., wrong ChatGPT-4o suggestions and physicians\' reasoning (medRxiv, 2025)','https://doi.org/10.1101/2025.08.23.25334280'],['Bean et al., LLMs as medical assistants for the public (Nature Medicine, 2026)','https://doi.org/10.1038/s41591-025-04074-y'],['Vaccaro, Almaatouq & Malone, When combinations of humans and AI are useful (Nature Human Behaviour, 2024)','https://doi.org/10.1038/s41562-024-02024-1'],['Gradual Disempowerment Observatory, landscape review 3.0 (Oct 2026)','https://github.com/nekocchi-0417/gd-observatory/blob/main/research/landscape/review-3.0.md']]},
  {id:'budzyn',tab:['Adenoma detection without AI, after using it','28.4% → 22.4%','Lancet G&H · 2025'],tag:'primary',rec:'d',recName:'Colonoscopy study',obs:[2022.0],
   title:'In a Polish clinical study, doctors detected fewer growths unaided after months of working with AI',
   sub:'Share of colonoscopies in which a precancerous growth (adenoma) was found, at four Polish centres, before and after routine AI assistance began.',
   render(el){Charts.bars(mk(el),{aria:'Adenoma detection rate 28.4% before AI, 22.4% after in non-AI procedures, 25.3% in AI-assisted procedures',min:0,max:32,ticks:[0,10,20,30],fmt:v=>v+'%',catLabel:'Procedures',valLabel:'Detection rate',
     rows:[{label:'Without AI, before AI was introduced (795 procedures)',value:28.4,color:C.s2},{label:'Without AI, after months of working with it (648 procedures)',value:22.4,color:C.s1},{label:'For comparison: AI-assisted procedures in the same period',value:25.3,color:C.ctx}]})},
   read:'Two clinic studies point opposite ways. In Poland (observational, 19 experienced endoscopists), detection without AI fell from 28.4% to 22.4%, but the number of colonoscopies nearly doubled after AI arrived, so fatigue or time pressure could explain the drop. In Japan, a three-year audit at one centre found no decline (Okumura et al. 2025, Endoscopy). Both concern image-recognition AI, not chatbots or other large language models; nothing comparable exists yet for those. The Polish figures are from the abstract and the press release; the journal has published a correction that was not read for this draft. Reviews in 2025 and 2026 describe quantitative evidence of clinical deskilling as scarce.',
   src:[['Budzyń et al., Endoscopist deskilling risk after exposure to AI in colonoscopy (Lancet Gastroenterology & Hepatology, 2025)','https://www.thelancet.com/journals/langas/article/PIIS2468-1253(25)00133-5/abstract'],['Science Media Centre, expert reaction','https://www.sciencemediacentre.org/expert-reaction-to-observational-study-looking-at-detection-rate-of-precancerous-growths-in-colonoscopies-by-health-professionals-who-perform-them-before-and-after-the-routine-introduction-of-ai/'],['Okumura et al., no deskilling over three years (Endoscopy, 2025)','https://doi.org/10.1055/a-2661-2624']]},
  {id:'whos',tab:['Chats with severe distortion potential','1 in 1,300','Claude.ai · Dec 2025'],tag:'company',rec:'p',recName:'Chats: distortion potential',obs:[ym(2025,12)],
   title:'About 1 in 1,300 real conversations shows severe potential to distort the user\'s picture of reality',
   sub:'How often 1.5 million Claude.ai conversations showed potential to disempower the user, as rated by classifiers.',
   render(el){pairs(el,[
     {v:'1 in 1,300',l:"conversations with severe potential to distort the user's picture of reality",w:'DEC 2025'},

     {v:'1 in 50 to 70',l:'conversations with mild potential, across the three types',w:'DEC 2025'}])},
   read:'Each conversation is judged alone, so nothing here shows one person changing over months. These are rates of "potential", not confirmed harm, from one company\'s product, analysed by that company. A separate feedback sample showed the rates rising through 2025, in figures published only as a chart; the authors say they cannot attribute the rise to any single cause. Two of the paper\'s four authors also co-wrote the Gradual Disempowerment paper.',
   src:[["Sharma, McCain, Douglas & Duvenaud, Who's in Charge? Disempowerment patterns in real-world LLM usage (Jan 2026)",'https://arxiv.org/abs/2601.19062']]},
  {id:'literacy',tab:['US adults at or below Level 1 in literacy','28%','PIAAC 2023 · was 19% in 2017'],tag:'primary',rec:'p',recName:'Literacy, numeracy tests',obs:[2023.0,ym(2023,6),2025.0],
   title:'US population tests of reading and maths were falling before AI arrived',
   sub:'US population tests of reading and maths, taken without AI. Background, not evidence of an AI effect.',
   render(el){pairs(el,[
     {from:'19%',v:'28%',l:'of US adults aged 16 to 65 at or below Level 1 in literacy, the lowest band',w:'PIAAC · 2017 → 2023'},
     {from:'29%',v:'34%',l:'of US adults at or below Level 1 in numeracy',w:'PIAAC · 2017 → 2023'},
     {v:'−7 points',l:'reading score of US 13 year olds, 2012 to 2023; maths fell 14 points. No change in either between 2023 and 2025',w:'NAEP LONG-TERM TREND'},
     {from:'54.6%',v:'48.5%',l:'of US adults read at least one book for pleasure in the past year',w:'NEA · 2012 → 2022'}])},
   read:'These are repeated, objective, population-wide US measures of unaided ability. PISA 2025 also hit record lows across the OECD; its link to AI use is an association only. They count as a nearby measure here because they test general reading and maths across the whole population, not the work that people hand to AI. None can be tied to AI: fieldwork for the 2023 adult survey ended in June 2023, and the fall among 13 year olds began around 2012. The next adult survey is years away, so these series will be slow to show any AI effect. The statistics agency flags low response rates for the 2023 adult survey.',
   src:[['NCES, PIAAC 2023 US national results (Dec 2024)','https://nces.ed.gov/surveys/piaac/2023/national_results.asp'],['NAEP Long-Term Trend 2023','https://www.nationsreportcard.gov/highlights/ltt/2023/'],['NAEP Long-Term Trend 2025','https://www.nationsreportcard.gov/ltt/2025/'],['National Endowment for the Arts, Federal data on reading for pleasure (2024)','https://www.arts.gov/stories/blog/2024/federal-data-reading-pleasure-all-signs-show-slump']]}],
 sceptic:['<b>Small and short.</b> Samples run from 16 to about 1,000 people; follow-up runs from minutes to a few months.',
  '<b>Confounded.</b> In the Polish clinical study, workload nearly doubled when AI arrived.',
  '<b>A longer study found no loss.</b> A three-year audit at a Japanese clinic found detection without AI held up (Okumura et al. 2025).',
  '<b>Design can fix it.</b> A tutor-style chatbot showed no harm to learning, and some ways of using AI in the Anthropic study scored 65% or more.',

  '<b>Losing a skill is not always a loss.</b> Few people miss long division. Someone has to judge which abilities matter.'],

{id:'institutions',n:8,name:'AI in government',line:'state',level:1,
 levelWhy:'Disclosures are counted; decisions rarely are',
 dir:'Disclosed use rising; hand-over of decisions unknown',asof:'Oct 2026',
 headline:'3,611 disclosed uses; decisions rarely counted',
 status:'Paperwork is counted; decisions rarely are',
 mech:'decisions routed through AI',
 claim:'Governments now disclose thousands of AI uses. Almost no public body counts how many decisions AI makes; London police\'s facial-recognition alerts are a rare exception.',
 deck:'US federal agencies reported 3,611 AI use cases for 2025, of which 445 are classed as high-impact. That is five times the 710 reported for 2023, when the rules were narrower. Courts have recorded more than 2,100 cases involving AI-invented material. These are counts of paperwork and of failures that were noticed. Almost no public body publishes how many decisions its AI systems make; London\'s Metropolitan Police, which counts the alerts from its facial-recognition cameras, is a rare exception. None we found publishes how often officials overrule AI.',
 tour:'The worry is that decisions get routed through AI. Governments disclose thousands of AI uses. Almost none publishes how many decisions AI makes.',
 inds:[
  {id:'inventory',tab:['AI uses disclosed by US agencies','3,611','2025 · 445 high-impact'],tag:'direct',rec:'p',recName:'US federal AI inventory',obs:[ym(2023,12),ym(2025,1),ym(2026,4)],
   title:'Disclosed federal AI uses went from 710 to 3,611 as reporting rules widened',
   sub:'AI use cases reported by US civilian federal agencies, and those classed as affecting rights or safety.',
   render(el){Charts.cols(mk(el),{aria:'US federal AI use-case inventory: 710 in 2023, 2,133 in 2024, 3,611 in 2025; high-impact 351 and 445',grouped:true,step:1,maxbw:58,
     ann:[{x:2023,y:520,dx:36,dy:0,anchor:'middle',text:'not\nreported'}],
     x:{min:2022.5,max:2025.5,ticks:[2023,2024,2025],tip:x=>String(Math.round(x))+' inventory',label:'Inventory year'},y:{max:4000,ticks:[0,1000,2000,3000,4000],fmt:v=>v.toLocaleString('en-GB'),tip:v=>v.toLocaleString('en-GB')},
     sets:[{name:'All reported use cases',color:C.s1,pts:[[2023,710,'via press',null,'710'],[2024,2133,'final count; 1,757 at first release',null,'2,133'],[2025,3611,'as of 13 Apr 2026',null,'3,611']]},
      {name:'Rights- or safety-impacting (2024) / high-impact (2025)',color:C.s2,pts:[[2024,351,'rights- and/or safety-impacting',null,'351'],[2025,445,'"high-impact", a redefined category',null,'445']]}]})},
   read:'A use case is a unit of paperwork: one chatbot and one benefits-eligibility model each count once. Reporting rules widened in 2024 and the high-impact category was redefined in 2025, so the years are not like-for-like. Defence and intelligence are excluded. OMB\'s summary counts 1,818 of the 2025 total as deployed or piloted. Of 227 deployed high-impact uses, 16 report an established appeal route and 44 completed testing; the rest mostly say "in progress" or leave it blank (filed in December 2025, before the April 2026 deadline). The 2025 form dropped the 2024 question on whether AI decides without direct human involvement (observatory tabulation of OMB\'s files).',
   src:[['OMB, 2025 Federal Agency AI Use Case Inventory (as of 13 Apr 2026)','https://github.com/ombegov/2025-Federal-Agency-AI-Use-Case-Inventory'],['OMB, 2024 Federal AI Use Case Inventory','https://github.com/ombegov/2024-Federal-AI-Use-Case-Inventory'],['FedScoop, 18 Dec 2024','https://fedscoop.com/federal-government-discloses-more-than-1700-ai-use-cases/']]},

    <section class="sec5" id="m-coverage"><h2 class="h2-5 sm">How coverage is assessed</h2><p class="sub5">Colour describes how well each step is measured as a whole. It does not score the level of risk or whether findings support the theory. A rigorous study of one task can sit within a step that still has major gaps.</p>
      <ul class="scale5 coverage-rubric5 s1">${[['major','Closest sources leave a central outcome or repeated measure missing. Existing studies may still be useful and rigorous.'],['partial','Measures cover narrow settings, tasks or indirect signals. Coverage of the broader step is incomplete.'],['stronger','Repeated, direct measures of the named quantity exist. Population coverage and attribution to AI can still be limited.']].map(([b,d])=>`<li>${coverageGlyph5(b,20)}<div><b>${esc(COPY.coverage.bands[b].label)}</b><span>${esc(d)}</span></div></li>`).join('')}</ul>
      <p class="note5">Provisional editorial ratings based on the selected evidence and its limits. This is not a systematic count of research or an independently validated score. Two priority sources alone cannot establish that a whole field is understudied.</p>
      <dl class="coverage-reasons5">${ORDER.map(id=>`<div><dt><a href="#${id}">${esc(nameOf(id))}</a>${coverageBadge5(id)}</dt><dd>${esc(coverageOf5(id).why)}</dd></div>`).join('')}</dl></section>
    <section class="sec5" id="m-more"><h2 class="h2-5 sm">Limits and sources</h2><p class="sub5">Coverage is uneven across countries and topics. No single indicator establishes gradual disempowerment. A dated finding is not necessarily the latest available value, and later versions may revise it.</p><details class="det5"><summary>Definitions at each step</summary><dl class="gloss">${ORDER.map(id=>`<div><dt>${esc(nameOf(id))}</dt><dd>${esc(DEFS[id][0])}<br><b>Still needed:</b> ${esc(SELECTED_EVIDENCE[id].gap)}</dd></div>`).join('')}</dl></details><details class="det5"><summary>All 18 priority sources</summary><div class="srcs">${ORDER.map(id=>`<div class="sg"><h4>${esc(nameOf(id))}</h4><ol>${SELECTED_EVIDENCE[id].sources.map(s=>`<li>${sourceLink6(s)}<br>${esc(s.title)}</li>`).join('')}</ol></div>`).join('')}</div></details><p class="review-links"><a class="go" href="https://gradual-disempowerment.ai/" target="_blank" rel="noopener">Original framework ↗</a><a class="go" href="pdf-source-crosswalk.html" target="_blank" rel="noopener">PDF reference crosswalk ↗</a></p></section></div>`;
}
