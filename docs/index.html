<!doctype html>
<html lang="en-GB" data-theme="light">
<head>
<meta charset="utf-8"><script>// Apply the saved choice before styles paint. Light is the default for this preview.
(() => {
  let theme = 'light';
  try {
    const saved = localStorage.getItem('gd-dashboard-theme');
    if (saved === 'light' || saved === 'dark') theme = saved;
  } catch (_) {
    // Storage can be unavailable when the preview is opened as a local file.
  }
  document.documentElement.setAttribute('data-theme', theme);
})();
</script>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="A research prototype on AI and human influence: proposed pathways, research questions, projects and funding opportunities.">
<title>Gradual Disempowerment Dashboard</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=IBM+Plex+Mono:wght@400;500&family=Source+Serif+4:ital,opsz,wght@0,8..60,400..700;1,8..60,400..700&display=swap">
<style>
:root{color-scheme:light}body{margin:0}img{max-width:100%}[hidden]{display:none!important}
/* Layout: a survey chart. Sticky top bar; one view at a time; the chain map is the home page's main object;
   evidence pages run claim → indicator tabs joined to a figure → three short lists. Rules over boxes.
   Colour grammar: blue, navy and grey are observed; orange is forecast; hatching is unmeasured. */
:root{
  --paper:#f1f4f6; --surface:#fbfcfd; --surface-2:#e7ecf0; --rule:#cfd8df; --grid:#e2e8ed;
  --ink:#0e1a26; --ink-2:#435363; --ink-3:#6b7986;
  --accent:#1c5cab; --accent-soft:#dbe7f5; --on-accent:#ffffff;
  /* evidence ramp for the map: 4 heavy line, 3 light line, 2 hollow line, 1 dots, 0 faint dots */
  --ev4:#0d366b; --ev3:#1c5cab; --ev2:#1c5cab; --ev1:#2a78d6; --ev0:#8f9ca8;
  /* observed series, fixed order: blue, navy, slate; context grey */
  --s1:#1c5cab; --s2:#5b9bea; --s3:#7b8996; --ctx:#a7b2bc; --map-bg:var(--surface);
  /* projection ramp: slow, central, rapid */
  --p1:#ee9670; --p2:#e0602c; --p3:#9c3d16; --on-p1:#16222e; --on-p2:#16222e; --on-p3:#ffffff;
  --f-display:"Archivo","Arial Narrow",Arial,sans-serif;
  --f-text:"Source Serif 4",Georgia,"Times New Roman",serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --maxw:1180px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --paper:#0e151d; --surface:#141d27; --surface-2:#1c2733; --rule:#2e3c4b; --grid:#212d39;
  --ink:#e8eef4; --ink-2:#aebac6; --ink-3:#8795a3;
  --accent:#7db2ee; --accent-soft:#172a40; --on-accent:#0b1420;
  --ev4:#9cc6f5; --ev3:#5b9bea; --ev2:#5b9bea; --ev1:#4a8be0; --ev0:#66747f;
  --s1:#8fbdf3; --s2:#3f76c0; --s3:#8795a3; --ctx:#5d6b79;
  --p1:#f2a685; --p2:#e2703f; --p3:#b84d1f; --on-p1:#0b1420; --on-p2:#0b1420; --on-p3:#ffffff;
  color-scheme:dark } }
:root[data-theme="dark"]{
  --paper:#0e151d; --surface:#141d27; --surface-2:#1c2733; --rule:#2e3c4b; --grid:#212d39;
  --ink:#e8eef4; --ink-2:#aebac6; --ink-3:#8795a3;
  --accent:#7db2ee; --accent-soft:#172a40; --on-accent:#0b1420;
  --ev4:#9cc6f5; --ev3:#5b9bea; --ev2:#5b9bea; --ev1:#4a8be0; --ev0:#66747f;
  --s1:#8fbdf3; --s2:#3f76c0; --s3:#8795a3; --ctx:#5d6b79;
  --p1:#f2a685; --p2:#e2703f; --p3:#b84d1f; --on-p1:#0b1420; --on-p2:#0b1420; --on-p3:#ffffff;
  color-scheme:dark }

*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{background:var(--paper);color:var(--ink);font-family:var(--f-display);font-size:15px;line-height:1.5;margin:0;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
.wrap{max-width:var(--maxw);margin:0 auto;padding-inline:20px}
h1,h2,h3,h4{font-family:var(--f-display);margin:0;text-wrap:balance;font-weight:700;letter-spacing:-.01em}
p{margin:0}
a{color:var(--accent);text-underline-offset:2px}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:2px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums;letter-spacing:0}
.lab{font-family:var(--f-mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)}
.prose{font-family:var(--f-text);font-size:17px;line-height:1.55;color:var(--ink)}
.prose p+p{margin-top:.8em}

/* ---------- top bar ---------- */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--paper) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--rule)}
.bar .wrap{display:flex;align-items:center;gap:8px 24px;min-height:52px;flex-wrap:wrap;padding-block:6px}
.mark{display:flex;align-items:center;gap:10px;font-weight:700;font-size:14px;letter-spacing:.01em;color:var(--ink);text-decoration:none;margin-right:auto;font-stretch:108%}
.mark svg{flex:0 0 auto}
.nav{display:flex;gap:2px;flex-wrap:wrap}
.nav a{font-size:13.5px;font-weight:500;color:var(--ink-2);text-decoration:none;padding:6px 10px;border-radius:4px;position:relative}
.nav a:hover{color:var(--ink);background:var(--surface-2)}
.nav a[aria-current="page"]{color:var(--ink)}
.nav a[aria-current="page"]::after{content:"";position:absolute;left:10px;right:10px;bottom:-7px;height:2px;background:var(--ink)}
@media (max-width:640px){.mark span{font-size:13px}.nav a{padding:5px 7px;font-size:13px}.nav .wip5{display:none}.nav a[aria-current="page"]::after{bottom:0;left:7px;right:7px}}

/* ---------- shared view chrome ---------- */
main{min-height:70vh;outline:0}
.view{padding-block:36px 56px}
.kicker{display:flex;flex-wrap:wrap;gap:4px 0;align-items:center;margin-bottom:14px}
.kicker .lab:not(:last-child)::after{content:"·";margin:0 9px;color:var(--ink-3)}
.h-xl{font-size:clamp(32px,4.6vw,54px);font-weight:800;line-height:1.02;letter-spacing:-.025em;font-stretch:105%}
.h-l{font-size:clamp(26px,3.4vw,38px);font-weight:750;line-height:1.08;letter-spacing:-.02em}
.h-m{font-size:clamp(20px,2.4vw,26px);line-height:1.15}
.h-claim{font-size:clamp(24px,3vw,34px);font-weight:750;line-height:1.1;letter-spacing:-.018em;max-width:26em}
.deck{font-family:var(--f-text);font-size:clamp(17px,1.7vw,20px);line-height:1.5;color:var(--ink-2);max-width:62ch;margin-top:16px}
.deck b,.deck strong{color:var(--ink);font-weight:600}
.sect{padding-top:48px}
.sect-head{display:grid;grid-template-columns:minmax(0,1fr);gap:8px;margin-bottom:22px}
.sect-head>h2{max-width:24em}.sect-head>p{max-width:74ch}
.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--ink);border-radius:999px;padding:7px 14px;font-size:13.5px;font-weight:600;background:transparent;color:var(--ink);text-decoration:none;white-space:nowrap}
.btn:hover{background:var(--ink);color:var(--paper)}
.btn.ghost{border-color:var(--rule);color:var(--ink-2);font-weight:500}
.btn.ghost:hover{background:var(--surface-2);color:var(--ink)}
.btn[disabled]{opacity:.4;pointer-events:none}
.chip{display:inline-flex;align-items:center;gap:6px;font-family:var(--f-mono);font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;border:1px solid var(--rule);border-radius:3px;padding:1px 6px;color:var(--ink-2);white-space:nowrap;background:var(--surface)}
.go{font-family:var(--f-display);font-size:13.5px;font-weight:600;color:var(--accent);text-decoration:none;white-space:nowrap}
.go:hover{text-decoration:underline}
.note{font-size:14px;color:var(--ink-2);line-height:1.5;max-width:84ch}
.note a,.srcline a{color:inherit}

/* signal bars: how well a link is measured */
.sig{display:inline-flex;align-items:flex-end;gap:2px;height:14px;vertical-align:-2px}
.sig i{width:4px;border-radius:1px;background:var(--rule)}
.sig i:nth-child(1){height:5px}.sig i:nth-child(2){height:8px}.sig i:nth-child(3){height:11px}.sig i:nth-child(4){height:14px}
.sig[data-l="1"] i:nth-child(-n+1),.sig[data-l="2"] i:nth-child(-n+2),.sig[data-l="3"] i:nth-child(-n+3),.sig[data-l="4"] i:nth-child(-n+4){background:var(--ink)}
.sig[data-l="0"] i{background:transparent;outline:1px dashed var(--ink-3);outline-offset:-1px}

/* ---------- home: hero + map ---------- */
.hero{padding-block:26px 0}
.herogrid{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:18px 56px;align-items:end}
.herogrid .deck{margin-top:0;padding-bottom:4px}
@media (max-width:900px){.herogrid{grid-template-columns:1fr}}
.mapwrap{margin-top:22px;border-top:1px solid var(--ink);border-bottom:1px solid var(--rule);background:var(--surface)}
.mapin{padding-inline:0;max-width:1240px}
.map{position:relative}
.map svg{display:block;width:100%;height:auto}
.map text.halo{paint-order:stroke;stroke:var(--surface);stroke-width:4px;stroke-linejoin:round}
.map .seg,.map .st,.map .mech,.map .key,.map .zone,.map .jn{transition:opacity .25s}
.map .st{cursor:pointer}
.map .st .ring{fill:var(--surface);transition:stroke-width .15s}
.map .st .hit{fill:transparent}
.map .st .nm{font-family:var(--f-display);font-weight:680;font-size:14.5px;fill:var(--ink)}
.map .st .big{font-family:var(--f-display);font-weight:780;font-size:25px;letter-spacing:-.02em;fill:var(--ink)}
.map .st .big.zero{fill:var(--map-bg);stroke:var(--ink);stroke-width:1.5px;font-size:27px}
.mlv.zero{color:transparent;-webkit-text-stroke:1.4px var(--ink)}
.map .st .val{font-family:var(--f-mono);font-size:10.5px;fill:var(--ink-2)}
.map .st .q{font-family:var(--f-display);font-size:22px;font-weight:750;fill:var(--ink-2)}
.map .st:hover .ring,.map .st:focus-visible .ring,.map .st.on .ring{stroke-width:7}
.map .st .core{opacity:0;fill:var(--ink);transition:opacity .15s}
.map .st.on .core,.map .st:hover .core{opacity:1}
.map .st:focus-visible{outline:0}
.map .st:focus-visible .nm,.map .st:hover .nm{text-decoration:underline}
.map .mech{font-family:var(--f-mono);font-size:10.5px;fill:var(--ink-3);letter-spacing:.02em}
.map .zlab{font-family:var(--f-mono);font-size:11.5px;letter-spacing:.16em;fill:var(--ink-2);font-weight:500}
.map .zlab.strong{fill:var(--ink);font-size:12.5px;font-weight:600}
.map .jn{fill:var(--ev3)}
.map .keyt{font-family:var(--f-display);font-size:12.5px;fill:var(--ink-2)}
.map.touring .seg,.map.touring .st,.map.touring .mech,.map.touring .key,.map.touring .jn{opacity:.32}
.map.touring .zone{opacity:.55}
.map.touring .seg.lit,.map.touring .st.lit,.map.touring .zone.lit{opacity:1}
.tourbox{position:absolute;left:1.8%;bottom:4.5%;width:min(44%,500px)}
.tourstart{display:flex;gap:12px;align-items:center;font-size:13px;color:var(--ink-2);line-height:1.35}
.tourbox.on{background:var(--surface);border:1.5px solid var(--ink);padding:12px 14px 12px;box-shadow:0 6px 20px rgba(8,20,32,.10)}
.tourtop{display:flex;justify-content:space-between;gap:10px;align-items:center}
.tourtop .dots{display:inline-flex;gap:4px}
.tourtop .dots i{width:6px;height:6px;border-radius:50%;border:1px solid var(--ink-3)}
.tourtop .dots i.done{background:var(--ink-3)}.tourtop .dots i.on{background:var(--ink);border-color:var(--ink)}
.tourname{font-weight:700;font-size:18px;margin-top:2px}
.tourbox p{font-family:var(--f-text);font-size:15px;line-height:1.4;color:var(--ink-2);margin-top:2px}
.tourbox .ctl{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.tourbox .ctl .btn{padding:5px 11px;font-size:12.5px}
.tourbox .ctl .x{margin-left:auto}
.maplead,.maplist,.mapkey2{display:none}
.mapnotes{display:grid;grid-template-columns:1.25fr 1.25fr 1fr;gap:14px 40px;padding:16px 20px 20px;border-top:1px solid var(--rule);font-family:var(--f-text);font-size:15.5px;line-height:1.5;color:var(--ink-2)}
.mapnotes b{font-family:var(--f-display);font-size:13.5px;color:var(--ink)}
@media (max-width:900px){.mapnotes{grid-template-columns:1fr}}
.counter{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.6fr);gap:14px 48px;margin-top:8px;padding-top:20px;border-top:1px solid var(--rule)}
.counter p{font-family:var(--f-text);font-size:16.5px;line-height:1.5;color:var(--ink-2);margin-top:6px}
.counter ol{margin:0;padding:0;list-style:none;counter-reset:c;columns:2 260px;column-gap:36px}
.counter li{counter-increment:c;font-family:var(--f-text);font-size:15.5px;line-height:1.45;color:var(--ink-2);padding:0 0 12px 26px;position:relative;break-inside:avoid}
.counter li::before{content:counter(c);position:absolute;left:0;top:1px;font-family:var(--f-mono);font-size:11.5px;color:var(--ink-3)}
.counter li b{color:var(--ink);font-weight:600;font-family:var(--f-display);font-size:14.5px}
@media (max-width:820px){.counter{grid-template-columns:1fr}}
.maplead{font-size:14px;color:var(--ink-2);padding:14px 20px 4px;max-width:60ch}
.maplead b{color:var(--ink)}
.maplist{list-style:none;margin:0;padding:6px 0 0}
.maplist ol{list-style:none;margin:0;padding:0}
.maplist li>button{display:grid;grid-template-columns:72px minmax(0,1fr) auto;gap:2px 12px;align-items:center;width:100%;padding:12px 20px 12px 14px;border-top:1px solid var(--grid);border-left:9px solid var(--ev4);margin-left:20px;width:calc(100% - 20px)}
.maplist li[data-l="3"]>button{border-left:5px solid var(--ev3);margin-left:22px;width:calc(100% - 22px)}
.maplist li[data-l="2"]>button{border-left:6px double var(--ev2);margin-left:22px;width:calc(100% - 22px)}
.maplist li[data-l="1"]>button{border-left:5px dotted var(--ev1);margin-left:22px;width:calc(100% - 22px)}
.maplist li[data-l="0"]>button{border-left:0;margin-left:0;width:100%;padding-left:36px;background:repeating-linear-gradient(45deg,transparent 0 6px,var(--grid) 6px 7.5px)}
.mlv{font-size:22px;font-weight:780;letter-spacing:-.02em;text-align:right;line-height:1}
.mln b{display:block;font-size:15px;font-weight:680;line-height:1.25}
.mln span{font-family:var(--f-mono);font-size:11px;color:var(--ink-2);line-height:1.3;display:block}
.maplist .fork{padding:9px 20px 7px;border-top:1px solid var(--rule);background:var(--surface-2)}
.maplist .fork.end{border-top:1px solid var(--ink-3)}
.maplist .grp>.lab{display:block;padding:10px 20px 4px 44px;border-top:1px solid var(--grid);color:var(--ink-2)}
.maplist .grp li:first-child>button{border-top:0}
.mapkey2{flex-wrap:wrap;gap:6px 18px;padding:12px 20px 14px;border-top:1px solid var(--grid);font-size:12.5px;color:var(--ink-2);align-items:center}
.mapkey2 .lab{flex-basis:100%}
.mapkey2 .k{display:inline-flex;align-items:center;gap:8px}
@media (max-width:979px){.map{display:none}.maplead{display:block}.maplist{display:block}.mapkey2{display:flex}}

/* verdict + findings */
.view3{margin-top:0}
.view3 p{font-family:var(--f-text);font-size:16.5px;line-height:1.5;color:var(--ink-2)}
.view3 h3{font-size:17px;gap:10px}
.view3>section{padding-bottom:18px}
.findings{display:grid;gap:0;border-top:1px solid var(--ink)}
.finding{display:grid;grid-template-columns:44px minmax(0,1.35fr) minmax(0,1fr);gap:10px 32px;padding:24px 0;border-bottom:1px solid var(--rule);align-items:center}
.finding .n{font-family:var(--f-mono);font-size:12px;color:var(--ink-3);align-self:start;padding-top:5px}
.finding h3{font-size:clamp(18px,2vw,22px);line-height:1.18;font-weight:700}
.finding p{font-family:var(--f-text);font-size:16.5px;line-height:1.5;color:var(--ink-2);margin-top:8px;max-width:60ch}
.finding .links{display:flex;gap:14px;flex-wrap:wrap;margin-top:10px}
.finding .thumb{min-width:0}
@media (max-width:760px){.finding{grid-template-columns:28px minmax(0,1fr)}.finding .thumb{grid-column:2}}
.thumbcap{font-family:var(--f-mono);font-size:10.5px;color:var(--ink-3);letter-spacing:.03em;margin-top:2px;display:block}
.duo{display:flex;gap:30px;align-items:flex-end;padding:10px 0 6px}
.duo b{display:block;font-size:38px;font-weight:780;letter-spacing:-.025em;line-height:1}
.duo b.zero{color:transparent;-webkit-text-stroke:1.5px var(--ink)}
.duo .thumbcap{margin-top:6px}

/* ---------- evidence index ---------- */
.idxhead{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,400px);gap:20px 60px;align-items:end}
.idxhead .glyph{display:block;opacity:.9}
.idxhead .glyph svg{display:block;width:100%;height:auto}
@media (max-width:900px){.idxhead{grid-template-columns:1fr}.idxhead .glyph{display:none}}
.idx{border-top:1px solid var(--ink);margin-top:26px}
.idx a{display:grid;grid-template-columns:30px 168px 200px minmax(0,1fr) 18px;gap:6px 24px;padding:18px 0;border-bottom:1px solid var(--rule);text-decoration:none;color:inherit;align-items:start}
.idx a:hover{background:var(--surface)}
.idx .n{font-family:var(--f-mono);font-size:12px;color:var(--ink-3);padding-top:4px}
.idx .nm{font-weight:700;font-size:16.5px;line-height:1.2}
.idx .mt{font-size:12.5px;font-weight:400;color:var(--ink-2);display:block;margin-top:6px}
.idx .bg b{display:block;font-size:26px;font-weight:780;letter-spacing:-.02em;line-height:1}
.idx .bg span{display:block;font-family:var(--f-mono);font-size:11px;color:var(--ink-2);line-height:1.35;margin-top:5px}
.idx .cl{font-family:var(--f-text);font-size:16.5px;line-height:1.45}
.idx .dir{display:block;font-family:var(--f-display);font-size:12.5px;color:var(--ink-3);margin-top:6px}
.idx .ar{color:var(--ink-3);padding-top:2px}
@media (max-width:900px){.idx a{grid-template-columns:28px minmax(0,1fr) 18px}.idx .bg,.idx .cl{grid-column:2}.idx .ar{grid-row:1;grid-column:3}}

/* ---------- link page ---------- */
.crumbs{display:flex;gap:0;overflow-x:auto;border-bottom:1px solid var(--rule);margin-bottom:26px;scrollbar-width:thin}
.crumbs a{flex:1 0 auto;display:flex;flex-direction:column;gap:5px;padding:10px 14px 9px 0;margin-right:14px;text-decoration:none;color:var(--ink-3);font-size:12.5px;font-weight:500;white-space:nowrap;border-bottom:3px solid transparent;margin-bottom:-1px}
.crumbs a .ln{display:block;height:6px;border-radius:3px;background:var(--ev4);min-width:44px}
.crumbs a[data-l="3"] .ln{height:4px;margin:1px 0;background:var(--ev3)}
.crumbs a[data-l="2"] .ln{height:4px;margin:1px 0;background:transparent;border:1.4px solid var(--ev2)}
.crumbs a[data-l="1"] .ln{height:4px;margin:1px 0;background:radial-gradient(circle,var(--ev1) 1.9px,transparent 2.2px) 0 0/9px 4px repeat-x;border-radius:0}
.crumbs a[data-l="0"] .ln{height:2px;margin:2px 0;background:radial-gradient(circle,var(--ev0) 1px,transparent 1.2px) 0 0/6px 2px repeat-x;border-radius:0}
.crumbs a:hover{color:var(--ink)}
.crumbs a[aria-current="page"]{color:var(--ink);font-weight:700;border-bottom-color:var(--ink)}
.claimgrid{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:20px 48px;align-items:start}
@media (max-width:900px){.claimgrid{grid-template-columns:1fr}}
.verdict{border-left:1px solid var(--rule);padding-left:22px;display:grid;gap:9px;font-size:13.5px;margin:0}
@media (max-width:900px){.verdict{border-left:0;padding-left:0;border-top:1px solid var(--rule);padding-top:14px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}}
.verdict dt{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);margin-bottom:1px}
.verdict dd{margin:0;font-weight:600;line-height:1.3}
.verdict dd small{display:block;font-weight:400;color:var(--ink-2);font-size:12.5px;margin-top:1px}
.figwrap{margin-top:28px}

/* ======================================================================================
   components.css: styles for components.js. Loaded after style.css.
   Tokens: "what the data show" ramp (--sg*), human-side accent (--hs*), spacing and type scale.
   ====================================================================================== */
:root{
  /* "What the data show": one teal hue, dark = more change. Grey is NOT a step: it means "can't tell".
     Light steps OKLCH L .40/.515/.625/.735 (ordinal check passes; lightest 2.04:1 on --paper). */
  --sg4:#00544d; --sg3:#00786e; --sg2:#329a8f; --sg1:#6dbab0; --sg0:#8f9ca8;
  --coverage-major:#b12b38; --coverage-partial:#9b570b; --coverage-stronger:#14704d; --map-path:#8593a0;
  /* human side (Skills and judgement, Human influence): an annotation colour, never a data colour */
  --hs:var(--accent); --hs-soft:var(--accent-soft); --hs-line:var(--accent-soft);
  /* spacing and type (17_ux_spec §4) */
  --gap-section:clamp(72px,9vw,128px); --gap-section-sm:clamp(56px,7vw,96px); --gap-hero:clamp(48px,6vw,80px);
  --gap-head:28px; --gap-stack:16px; --gap-tight:8px; --pad-card:clamp(20px,2.4vw,32px); --gutter:clamp(16px,4vw,40px);
  --t-xs:.6875rem; --t-sm:.8125rem; --t-base:1rem; --t-prose:1.0625rem; --t-lead:clamp(1.1875rem,1.6vw,1.375rem);
  --t-h3:clamp(1.0625rem,1.4vw,1.25rem); --t-h2:clamp(1.75rem,3.2vw,2.5rem); --t-h1:clamp(2.125rem,4.6vw,3.5rem);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  /* reversed: more change = lighter = more contrast on the dark surface. Lightest-contrast step 3.0:1 on --paper. */
  --sg4:#7ee7d9; --sg3:#47c3b5; --sg2:#329a8f; --sg1:#2e6c65; --sg0:#66747f;
  --coverage-major:#ff8e98; --coverage-partial:#efbb64; --coverage-stronger:#72d5a5; --map-path:#7f8e9b;
  --hs:var(--accent); --hs-soft:var(--accent-soft); --hs-line:var(--accent-soft); } }
:root[data-theme="dark"]{
  --sg4:#7ee7d9; --sg3:#47c3b5; --sg2:#329a8f; --sg1:#2e6c65; --sg0:#66747f;
  --coverage-major:#ff8e98; --coverage-partial:#efbb64; --coverage-stronger:#72d5a5; --map-path:#7f8e9b;
  --hs:var(--accent); --hs-soft:var(--accent-soft); --hs-line:var(--accent-soft); }

.sr5{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}

.hs5tag::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--hs)}

/* ---------------- 1. map ---------------- */
.mapcard5{background:var(--surface);border-top:1px solid var(--ink);border-bottom:1px solid var(--rule);--map-bg:var(--surface);--glyph-bg:var(--surface)}
.map5{position:relative;max-width:1240px;margin:0 auto}
.map5 svg{display:block;width:100%;height:auto;max-height:480px}
.map5 text{font-family:var(--f-display)}
.map5 .zl5{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.14em;fill:var(--ink-3)}
.map5 .halo5{paint-order:stroke;stroke:var(--surface);stroke-width:5px;stroke-linejoin:round}
.map5 .hs5lab{font-family:var(--f-mono);font-size:10px;letter-spacing:.14em;fill:var(--hs);font-weight:500}

.map5 .st5:hover .core5,.map5 .st5:focus-visible .core5{opacity:1}

.map5 .badge5 circle{fill:var(--surface);stroke:var(--ink-2);stroke-width:1.3;transition:fill .15s}
.map5 .badge5 text{font-family:var(--f-text);font-style:italic;font-weight:700;font-size:12.5px;fill:var(--ink-2)}
.map5 .sh5:hover .badge5 circle,.map5 .sh5:focus-visible .badge5 circle,.map5 .sh5.sel .badge5 circle{fill:var(--ink);stroke:var(--ink)}
.map5 .sh5:hover .badge5 text,.map5 .sh5:focus-visible .badge5 text,.map5 .sh5.sel .badge5 text{fill:var(--surface)}
.map5 .seg5,.map5 .st5,.map5 .jn5{transition:opacity .2s}
.map5.has-sel .seg5:not(.sel){opacity:.25}
.map5.has-sel .st5:not(.sel){opacity:.55}
.mkey5{display:flex;flex-wrap:wrap;align-items:center;gap:6px 18px;padding:12px 20px 2px;font-size:12.5px;color:var(--ink-2);max-width:1240px;margin:0 auto}

.ib5{width:18px;height:18px;border-radius:50%;border:1.3px solid var(--ink-2);display:inline-grid;place-items:center;font:italic 700 12px/1 var(--f-text);color:var(--ink-2)}

/* drawer */
.md5{display:grid;grid-template-rows:0fr;transition:grid-template-rows .2s ease;max-width:1240px;margin:0 auto}

.rb5{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:1fr 1fr;gap:12px 18px;padding-top:20px}
.rb5 li{display:flex;gap:8px;align-items:flex-start;font-size:14px;font-weight:600;line-height:1.25}

.rb5-2 .rb5-m{background:var(--accent);color:var(--surface)}
.rb5-1 .rb5-m{background:var(--accent-soft);color:var(--accent)}

/* phone list */
.mlist5{display:none;list-style:none;margin:0;padding:6px 0 4px}
.ml5{display:grid;grid-template-columns:20px minmax(0,1fr);gap:0 14px;align-items:start;padding:0 16px;min-height:52px}
.ml5-line{align-self:stretch;position:relative}
.ml5-line::before{content:"";position:absolute;left:50%;top:0;bottom:0;transform:translateX(-50%)}
.ml5[data-l="4"] .ml5-line::before{width:7px;background:var(--ev4)}

/* ---------- v5.2: tour on the map, link tabs, matrix key ---------- */

/* home: three-sentence intro above the map */
.intro5 ol{list-style:none;margin:0;padding:0 0 18px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px 28px}
.intro5 li{display:flex;gap:10px;align-items:flex-start;font-size:14.5px;line-height:1.45;color:var(--ink-2)}

/* home: the step card */
.map5{position:relative}
.map5>svg{position:relative;z-index:1}
.card5{position:absolute;left:2%;bottom:4%;width:min(36%,430px);min-height:210px;display:flex;flex-direction:column;z-index:2;background:var(--surface);border:1.5px solid var(--ink);border-radius:8px;padding:14px 16px 14px;box-shadow:0 8px 24px rgba(8,20,32,.10)}
.map5.hover-preview .card5{opacity:0;visibility:hidden;pointer-events:none;transform:translateY(8px);transition:opacity .16s,transform .16s}
.map5.hover-preview.has-card .card5{opacity:1;visibility:visible;pointer-events:auto;transform:none}
.card5-n,.ml5-card .card5-n{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.card5-name{font-weight:750;font-size:18px;margin-top:2px;color:var(--ink)}

.card5-ms b{color:var(--ink);font-weight:650}
.card5-ctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;padding-top:12px;margin-top:auto}
.card5-nav{display:flex;gap:6px;align-items:center}
.card5-ctl .btn{display:inline-flex;gap:6px;align-items:center;justify-content:center;min-height:32px;padding:6px 10px;font-size:13px;white-space:nowrap}
.card5-ctl .btn[data-t="prev"]{width:32px;padding:6px}
.card5-ctl [data-t="prev"] .chev5{transform:rotate(180deg)}
.card5-ctl .chev5{flex:0 0 14px;width:14px;height:14px}
.card5-ctl .btn.pri{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.card5-ctl .btn.pri:hover{background:var(--accent);border-color:var(--accent)}
.map5.spotlight-on .seg5,.map5.spotlight-on .jn5,.map5.spotlight-on .st5{transition:opacity .16s,stroke-width .16s}
.map5.spotlight-on.has-card .seg5,.map5.spotlight-on.has-card .jn5{opacity:.22}
.map5.spotlight-on.has-card .seg5.active{opacity:1;stroke-width:4.2}
.map5.spotlight-on.has-card .st5{opacity:.32}
.map5.spotlight-on.has-card .st5.here{opacity:1}
.map5.has-card .st5.here .ring5{stroke-width:5.5;filter:drop-shadow(0 0 4px var(--coverage-color))}
.map5.has-card .st5.here .core5{opacity:1}
.map5.has-card .st5.here .nm5{text-decoration:underline;text-underline-offset:3px;text-decoration-thickness:2px}
/* phone list rows */
.ml5-btn{display:flex;justify-content:space-between;align-items:center;width:100%;min-height:52px;padding:0;background:none;border:0;font:inherit;text-align:left;color:var(--ink);cursor:pointer}
.ml5-btn .chev5{transition:transform .15s;color:var(--ink-3)}
.ml5.open .ml5-btn .chev5{transform:rotate(90deg)}
.ml5-card:empty{display:none}
.ml5-card{grid-column:2/-1;padding:0 0 14px}
.ml5-card .card5-name{display:none}
@media (prefers-reduced-motion:reduce){.ml5-btn .chev5,.map5.spotlight-on .seg5,.map5.spotlight-on .jn5,.map5.spotlight-on .st5,.map5.hover-preview .card5{transition:none}}

/* Measurement coverage is shared by the map, overview and rubric. */
[data-coverage="major"]{--coverage-color:var(--coverage-major)}
[data-coverage="partial"]{--coverage-color:var(--coverage-partial)}
[data-coverage="stronger"]{--coverage-color:var(--coverage-stronger)}
.coverage-header5{padding-block:28px 18px}
.coverage-header5 .h2-5{font-size:26px;letter-spacing:0}
.coverage-takeaway5{font-size:16px;color:var(--ink-2);margin-top:6px}
.coverage-key5{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:22px;padding:8px;border:1px solid var(--rule);border-radius:8px;background:var(--surface-2)}
.coverage-key5-item{display:flex;gap:10px;align-items:center;min-width:0;padding:12px 14px;border:1px solid var(--rule);border-radius:7px;background:var(--surface)}
.coverage-key5-item[data-coverage]{border-color:color-mix(in srgb,var(--coverage-color) 42%,var(--rule));background:color-mix(in srgb,var(--coverage-color) 10%,var(--surface))}
.coverage-key5-item>span{display:flex;flex-direction:column;gap:1px}
.coverage-key5-item b{font-size:15px;color:var(--coverage-color)}
.coverage-key5-item>span>span{font-size:13px;color:var(--ink-2)}
.coverage-glyph5{display:inline-block;flex:0 0 auto;vertical-align:middle}
.coverage-note5{font-size:12.5px;color:var(--ink-2);line-height:1.5;margin-top:16px}
.coverage-note5 a{margin-left:8px;white-space:nowrap}
.coverage-badge5{display:inline-flex;align-items:center;gap:7px;color:var(--coverage-color);font-size:13px;font-weight:600;line-height:1.3}
.map5 .coverage-label5{font-size:11.5px;font-weight:600;fill:var(--coverage-color);letter-spacing:0}
.map5 .research-prompt5{font-size:11px;font-weight:500;fill:var(--ink);letter-spacing:0}
.map5 .st5:focus-visible .ring5{outline:2px solid var(--ink);outline-offset:4px}
.map5.has-card .st5.here[data-coverage="major"] .ring5{stroke-width:4.2}
.card5{min-height:194px;border-color:var(--rule);box-shadow:none}
.card5-meta{display:flex;justify-content:space-between;gap:8px;align-items:center}
.card5-meta .card5-n{letter-spacing:0;flex:0 0 auto}
.card5-meta .coverage-badge5{font-size:12px}
.card5-name{margin-top:8px}
.card5-research{margin-top:10px}
.card5-research>b{font-size:12px;font-weight:600;color:var(--ink-2)}
.card5-research .card5-what{font-family:var(--f-display);font-size:14px;line-height:1.45;margin-top:2px;color:var(--ink)}
.ml5-labels{display:flex;flex-direction:column;gap:3px;min-width:0}
.ml5-coverage{font-size:12.5px;font-weight:600;color:var(--coverage-color)}
.ml5-prompt{font-size:13px;color:var(--ink-2)}
.ml5-btn{min-height:72px;padding-block:12px;gap:12px}
.ml5-btn .chev5{flex:0 0 14px}
.ml5-line::before{width:2px;background:var(--map-path)}

.ml5-card{padding-bottom:18px}

.er5-head,.er5{grid-template-columns:minmax(0,1.1fr) 190px minmax(0,2.2fr) 18px;gap:4px 24px}
.er5-head{display:grid;padding:22px 8px 10px 26px;color:var(--ink-2);font-size:12px;font-weight:600}

#m-coverage{scroll-margin-top:80px}
@media (max-width:760px){
  .coverage-header5{padding-block:24px 16px}
  .coverage-key5{grid-template-columns:1fr;gap:12px;margin-top:18px}

}

function home28(v) {

    <section class="wrap home-sections28" aria-label="Explore the dashboard"><div><h2 class="h2-5 sm"><a href="#gaps">Research questions <span aria-hidden="true">→</span></a></h2><p>Nine topics along the proposed pathways.</p></div><div><h2 class="h2-5 sm"><a href="#projects">Projects &amp; grants <span aria-hidden="true">→</span></a></h2><p>Research programmes and funding opportunities.</p></div><div><h2 class="h2-5 sm"><a href="#contribute">Contribute <span aria-hidden="true">→</span></a></h2><p>Share a study, a measure or a correction.</p></div></section><div class="wrap"><p class="release-note28">Research prototype. Topic reviews and selected evidence are AI-assisted and pending human review.</p></div></div>`;

function diagram28() {
  return `<div class="gap-map-scroll20" tabindex="0" role="region" aria-label="Proposed pathways diagram with links to topic reviews."><svg class="map5 gap-map20 neutral-map28" viewBox="0 0 ${GEO5.W} ${GEO5.H}" aria-labelledby="path-title28 path-desc28"><title id="path-title28">Proposed pathways of gradual disempowerment</title><desc id="path-desc28">AI capability, adoption and delegation connect to work, income, skills, culture and government, and ultimately human influence. These are proposed relationships. No evidence coverage ratings are shown.</desc><text x="24" y="28" class="map-section28">AI SYSTEMS AND USE</text><text x="490" y="28" class="map-section28">POSSIBLE CONSEQUENCES</text><text x="1040" y="28" class="map-section28">INFLUENCE</text>
    ${SEGS5.map(s => { const points = s.from === '_' ? [s.p[0], [GEO5.S.influence[0] - 9, GEO5.TY]] : s.p; return `<path class="path28" d="M${points.map(p => p.join(' ')).join(' L')}"/>`; }).join('')}
    ${TOPICS28.map(([id, title]) => {const [x,y] = GEO5.S[id]; return `<a class="node28" href="${topicHref28(id)}" aria-label="${esc(title)}: studies and measurement gaps"><title>${esc(title)}: studies and measurement gaps</title><circle class="hit28" cx="${x}" cy="${y}" r="23"/><circle class="node-ring28" cx="${x}" cy="${y}" r="9"/><text class="node-label28" x="${x}" y="${y - 24}" text-anchor="middle">${esc(title)}</text></a>`;}).join('')}

function gaps28(v) {
  const groups = [['AI systems and use', ['capability','adoption','handover']], ['Work and skills', ['work','share','skills']], ['Institutions and influence', ['culture','institutions','influence']]];
  v.innerHTML = `<div class="view5 wrap gaps20 gaps28"><header class="intro20"><div class="eye5">Research gaps</div><h1 class="h1-5" id="main-content">Where do we need better measures?</h1><p class="diagram-intro26">Proposed pathways, adapted from ${ext7('https://gradual-disempowerment.ai/', 'the original paper')}. The questions below guide our ongoing review.</p></header>${diagram28()}
    <section class="topics28" aria-labelledby="topics-title28"><div class="topics-head28"><h2 class="h2-5 sm" id="topics-title28">Explore the research</h2><span class="status28">AI-assisted &middot; Human review pending</span></div><div class="gap-columns20">${groups.map(([name, ids]) => `<section class="topic-group28"><h3>${name}</h3><ul>${ids.map(id => {const [,title,question] = TOPICS28.find(t => t[0] === id); return `<li><a class="gap-step20" href="${topicHref28(id)}"><h4>${esc(title)}</h4><p>${esc(question)}</p><span class="topic-status28">Studies and measurement gaps &rarr;</span></a></li>`;}).join('')}</ul></section>`).join('')}</div></section></div>`;

function method28(v) {
  v.innerHTML = `<div class="view5 wrap method22"><header class="intro20"><div class="eye5">Method</div><h1 class="h1-5" id="main-content">What this prototype covers</h1><p class="lead5">Research on how AI could affect human skills, choices and influence.</p></header>
    <section class="method-section28"><h2 class="h2-5 sm">The pathways</h2><p>The diagram is adapted from ${ext7('https://gradual-disempowerment.ai/', 'the gradual disempowerment paper')}, with an additional branch for skills and judgement. It organises research questions around the proposed relationships.</p></section>
    <section class="method-section28"><h2 class="h2-5 sm">Current status</h2><p>Topic pages contain AI-assisted research summaries, evidence maps and open measurement questions. Selected evidence brings together six findings with source data and caveats. Both are pending human review. Evidence-coverage ratings remain on hold.</p></section>
    <section class="method-section28"><h2 class="h2-5 sm">How sources are selected</h2><p>The shortlist prioritises relevance, clear outcomes, useful comparisons or repeated observations, and traceable primary sources. It includes findings that complicate the argument. Each source states why it was selected.</p><details class="method-details28"><summary>Scope and review checks</summary><p>This is a targeted scoping scan, not a systematic review. The October 22 expansion distinguishes full-paper access, official summaries and abstracts. Imported reading leads are kept separate from detailed extractions.</p><ul><li>Confirm the primary source, version, population and outcome.</li><li>Check figures, units, comparisons and the time period.</li><li>Match each claim to the study's design and scope.</li><li>Consider competing explanations and contradictory evidence.</li></ul><p>Human review is still required. Search records and limitations accompany each topic library. The skills and judgement page retains the earlier scan.</p></details></section>
    <section class="method-section28"><h2 class="h2-5 sm">Maps and measurement gaps</h2><p>The expanded maps group extracted sources by research question and measurement over time. Skills and judgement retains its theme-by-design map. Counts describe these collections; they do not score evidence quality or establish a field-wide gap.</p><p>Each proposed measurement gap links to the sources behind it. These provisional interpretations can change as the review expands.</p></section>
    <section class="method-section28"><h2 class="h2-5 sm">Projects &amp; grants</h2><p>The directory is manually maintained. Each entry links to its organiser and shows its last source-check date. Availability can change.</p></section></div>`;
}

function render28() {
  let raw = (location.hash || '#home').slice(1);
  if (raw === 'main-content') {
    if (document.querySelector('#view h1')) { document.querySelector('#view').focus(); return; }
    raw = 'home';
  }
  const parts = raw.split(/[/?]/), root = parts[0];
  const topic = TOPICS28.find(([id]) => root === id || ['gaps','topic'].includes(root) && parts[1] === id);
  const aliases = {map:'home', about:'method', methods:'method', futures:'projects', grants:'projects', emerging:'evidence', findings:'evidence'};
  let route = aliases[root] || root || 'home', title;
  const v = document.querySelector('#view');
  if (topic) { location.replace(topicHref28(topic[0])); return; }
  else if (route === 'evidence') { location.replace('topics/evidence.html'); return; }
  else if (route === 'library') { const id = TOPICS28.find(([id]) => parts[1] === id)?.[0]; location.replace(id ? topicHref28(id,true) : 'topics/topics.html'); return; }
  else if (route === 'home') { home28(v); title = 'Home'; }
  else if (route === 'gaps') { gaps28(v); title = 'Research gaps'; }
  else if (route === 'projects') { viewProjects21(v, root === 'grants' ? 'grants' : parts[1]); title = 'Projects & grants'; }
  else if (route === 'contribute') { viewContribute21(v); title = 'Contribute'; }
  else if (route === 'method') { method28(v); title = 'Method'; }
  else { title = route === 'library' ? 'Evidence library' : 'Selected findings'; hold28(v, title); route = 'evidence'; }
  document.title = `${title} | Gradual Disempowerment Dashboard`;
  v.querySelector('h1')?.setAttribute('id', 'main-content');
  document.querySelectorAll('.nav a').forEach(a => {
    if (a.getAttribute('href') === '#' + route) a.setAttribute('aria-current','page');
    else a.removeAttribute('aria-current');
  });
  window.scrollTo(0, 0);
}
window.addEventListener('hashchange', () => { render28(); document.querySelector('#view').focus({preventScroll:true}); });
render28();

(() => {
  const control = document.querySelector('.appearance22');
  const buttons = [...control.querySelectorAll('[data-theme-choice]')];
  const apply = theme => {
    document.documentElement.setAttribute('data-theme', theme);
    buttons.forEach(button => button.setAttribute('aria-pressed', String(button.dataset.themeChoice === theme)));
  };
  apply(document.documentElement.getAttribute('data-theme'));
  control.addEventListener('click', event => {
    const button = event.target.closest('[data-theme-choice]');
    if (!button || !control.contains(button)) return;
    const theme = button.dataset.themeChoice;
    apply(theme);
    try { localStorage.setItem('gd-dashboard-theme', theme); } catch (_) {}
  });
  window.addEventListener('storage', event => {
    if (event.key === 'gd-dashboard-theme' || event.key === null) {
      apply(event.newValue === 'dark' ? 'dark' : 'light');
    }
  });
})();
